<title>カロリーノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F3F4EF;
    --card:#FFFFFF;
    --ink:#171B16;
    --muted:#6E756B;
    --hair:#D6D9D0;
    --rule:#171B16;
    --accent:#37694A;
    --accent-soft:#DEE9E0;
    --warn:#A8542C;
    --warn-soft:#F1E0D5;
    --shadow:0 1px 0 rgba(23,27,22,.06), 0 6px 22px -14px rgba(23,27,22,.5);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121510;
      --card:#1A1E18;
      --ink:#E9EDE4;
      --muted:#98A092;
      --hair:#2E3429;
      --rule:#E9EDE4;
      --accent:#8CC49B;
      --accent-soft:#233127;
      --warn:#E09A6E;
      --warn-soft:#3A2A20;
      --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px #000;
    }
  }
  :root[data-theme="dark"]{
    --paper:#121510;
    --card:#1A1E18;
    --ink:#E9EDE4;
    --muted:#98A092;
    --hair:#2E3429;
    --rule:#E9EDE4;
    --accent:#8CC49B;
    --accent-soft:#233127;
    --warn:#E09A6E;
    --warn-soft:#3A2A20;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px #000;
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Archivo","Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .eyebrow{
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);
  }

  .wrap{max-width:540px;margin:0 auto;padding:20px 18px 56px;display:flex;flex-direction:column;gap:20px}

  /* ---- header ---- */
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .brand{display:flex;flex-direction:column;gap:1px}
  .brand b{font-size:21px;font-weight:700;letter-spacing:.01em}
  .goal-btn{
    display:flex;flex-direction:column;align-items:flex-end;gap:1px;
    padding:6px 10px;border:1px solid var(--hair);border-radius:3px;background:var(--card);
  }
  .goal-btn .v{font-size:15px;font-weight:700}
  .goal-btn:hover{border-color:var(--accent)}

  .settings{
    border:1px solid var(--hair);background:var(--card);border-radius:3px;padding:14px;
    display:flex;flex-direction:column;gap:10px;
  }
  .settings .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .settings input{
    width:110px;padding:8px 10px;border:1px solid var(--hair);border-radius:2px;
    background:var(--paper);text-align:right;font-variant-numeric:tabular-nums;font-weight:600;
  }
  .settings .note{font-size:12px;color:var(--muted);line-height:1.5}

  .banner{
    display:flex;gap:8px;align-items:baseline;
    padding:9px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);
    font-size:12.5px;color:var(--ink);border-radius:0 3px 3px 0;
  }
  .banner b{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

  /* ---- date nav ---- */
  .daynav{display:flex;align-items:center;gap:6px}
  .daynav .arrow{
    width:34px;height:34px;border:1px solid var(--hair);border-radius:2px;background:var(--card);
    font-size:17px;line-height:1;display:grid;place-items:center;
  }
  .daynav .arrow:disabled{opacity:.32;cursor:default}
  .daynav .arrow:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
  .daylabel{flex:1;display:flex;align-items:baseline;gap:8px;padding-left:4px}
  .daylabel .d{font-size:19px;font-weight:700}
  .daylabel .w{font-size:12px;color:var(--muted)}
  .today-btn{
    font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);
    border:1px solid var(--accent);border-radius:2px;padding:5px 8px;
  }

  /* ---- facts panel ---- */
  .facts{
    background:var(--card);border:1px solid var(--hair);border-radius:3px;
    padding:14px 16px 16px;box-shadow:var(--shadow);
  }
  .facts-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .facts-total{display:flex;align-items:baseline;gap:6px}
  .facts-total .n{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .facts-total .u{font-size:13px;font-weight:600;color:var(--muted)}
  .rule-thick{height:6px;background:var(--rule);margin:10px 0 0}
  .frow{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:7px 0;border-bottom:1px solid var(--hair);font-size:13.5px;
  }
  .frow .k{color:var(--muted)}
  .frow .v{font-weight:700;font-variant-numeric:tabular-nums}
  .frow.big .v{font-size:16px}
  .frow.over .v{color:var(--warn)}
  .frow.under .v{color:var(--accent)}
  .budget{
    position:relative;height:9px;margin-top:12px;background:var(--paper);
    border:1px solid var(--hair);border-radius:99px;overflow:hidden;
  }
  .budget .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .budget.is-over .fill{background:var(--warn)}
  .breakdown{
    display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:11px;font-size:12px;color:var(--muted);
  }
  .breakdown span b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

  /* ---- meals ---- */
  .meals{display:flex;flex-direction:column;gap:2px}
  .meal{border-top:1px solid var(--hair);padding:12px 2px 10px}
  .meal:last-child{border-bottom:1px solid var(--hair)}
  .meal-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .meal-head h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
  .meal-head .en{font-size:9.5px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .meal-head .k{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .meal-head .k em{font-style:normal;font-size:10px;color:var(--muted);margin-left:3px}
  .meal-head .k.zero{color:var(--muted);font-weight:500}
  .items{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
  .items li{
    display:grid;grid-template-columns:1fr auto 26px;align-items:baseline;gap:8px;
    padding:5px 0;border-bottom:1px dotted var(--hair);font-size:14px;
  }
  .items .nm{overflow-wrap:anywhere}
  .items .kc{font-weight:700;font-variant-numeric:tabular-nums}
  .items .kc em{font-style:normal;font-size:10px;color:var(--muted);margin-left:2px;font-weight:500}
  .items .del{color:var(--muted);font-size:15px;line-height:1;justify-self:end;padding:2px 5px;border-radius:2px}
  .items .del:hover{color:var(--warn);background:var(--warn-soft)}
  .is-demo .items li{color:var(--muted)}
  .add-btn{
    margin-top:9px;font-size:12.5px;font-weight:700;color:var(--accent);
    border:1px dashed var(--hair);border-radius:2px;padding:7px 11px;width:100%;text-align:left;
  }
  .add-btn:hover{border-color:var(--accent);background:var(--accent-soft)}

  .addform{margin-top:10px;display:flex;flex-direction:column;gap:9px}
  .sug{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    display:inline-flex;align-items:baseline;gap:6px;
    border:1px solid var(--hair);background:var(--card);border-radius:99px;padding:5px 11px;font-size:12.5px;
  }
  .chip .c{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
  .chip:hover{border-color:var(--accent);background:var(--accent-soft)}
  .chip.freq{border-color:var(--accent)}
  .manual{display:grid;grid-template-columns:1fr 84px auto;gap:6px}
  .manual input{
    padding:9px 10px;border:1px solid var(--hair);border-radius:2px;background:var(--card);min-width:0;
  }
  .manual input[type="number"]{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .manual button{
    padding:0 14px;background:var(--accent);color:var(--card);border-radius:2px;
    font-size:13px;font-weight:700;
  }
  .manual button{color:var(--paper)}
  .hint{font-size:11.5px;color:var(--muted)}
  .empty{font-size:12.5px;color:var(--muted);padding:6px 0 0}

  /* ---- history ---- */
  .history{border:1px solid var(--hair);background:var(--card);border-radius:3px;padding:14px 12px 10px}
  .history-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 6px}
  .history-head .avg{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .history-head .avg em{font-style:normal;font-size:10px;color:var(--muted);font-weight:500;margin-left:3px}
  .history svg{display:block;width:100%;height:auto;overflow:visible}
  .chart-note{font-size:11.5px;color:var(--muted);padding:2px 4px 0}

  footer{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);padding-top:2px}
  .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--accent);margin-right:5px;vertical-align:middle}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">MEAL &amp; CALORIE LOG</span>
      <b>カロリーノート</b>
    </div>
    <button class="goal-btn" id="goalBtn" aria-expanded="false">
      <span class="eyebrow">1日の目標</span>
      <span class="v num" id="goalBtnVal">2,000 kcal</span>
    </button>
  </header>

  <section class="settings" id="settings" hidden>
    <div class="row">
      <label for="targetInput" style="font-size:13.5px;font-weight:700">1日の目標カロリー</label>
      <input id="targetInput" type="number" inputmode="numeric" min="500" max="6000" step="10" value="2000">
      <span style="font-size:12px;color:var(--muted)">kcal</span>
      <button id="targetSave" style="padding:8px 14px;background:var(--accent);color:var(--paper);border-radius:2px;font-size:13px;font-weight:700">保存</button>
    </div>
    <p class="note" id="storageNote">保存先を確認しています…</p>
  </section>

  <div class="banner" id="demoBanner" hidden>
    <b>Sample</b>
    <span>サンプル表示です。最初の記録を追加すると消えます。</span>
  </div>

  <section class="daynav">
    <button class="arrow" id="prevDay" aria-label="前の日">‹</button>
    <div class="daylabel">
      <span class="d" id="dateMain">—</span>
      <span class="w" id="dateSub"></span>
    </div>
    <button class="today-btn" id="todayBtn" hidden>今日へ</button>
    <button class="arrow" id="nextDay" aria-label="次の日">›</button>
  </section>

  <section class="facts" id="facts">
    <div class="facts-top">
      <div>
        <div class="eyebrow">この日の合計</div>
        <div class="facts-total"><span class="n num" id="totalKcal">0</span><span class="u">kcal</span></div>
      </div>
      <div style="text-align:right">
        <div class="eyebrow">記録</div>
        <div class="num" style="font-size:15px;font-weight:700" id="itemCount">0 品</div>
      </div>
    </div>
    <div class="rule-thick"></div>
    <div class="frow"><span class="k">目標</span><span class="v num" id="targetVal">2,000 kcal</span></div>
    <div class="frow big" id="remainRow"><span class="k" id="remainLabel">残り</span><span class="v num" id="remainVal">2,000 kcal</span></div>
    <div class="budget" id="budget"><div class="fill" id="budgetFill" style="width:0%"></div></div>
    <div class="breakdown" id="breakdown"></div>
  </section>

  <section class="meals" id="meals"></section>

  <section class="history">
    <div class="history-head">
      <div>
        <div class="eyebrow">この日までの7日間</div>
      </div>
      <div class="avg num" id="avgVal">— <em>平均 kcal / 記録日</em></div>
    </div>
    <div id="chart"></div>
    <p class="chart-note" id="chartNote">破線は目標カロリー。棒はその日の合計です。</p>
  </section>

  <footer>
    <span id="storageState"><span class="dot"></span>保存先を確認中…</span>
    <span id="msg"></span>
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- 食品カロリー目安（1食あたりの一般的な値） ---------------- */
  var CATALOG = [
    // 主食
    {n:"ご飯 茶碗1杯(150g)",k:234,g:"主食"},
    {n:"ご飯 大盛り(250g)",k:390,g:"主食"},
    {n:"食パン 6枚切1枚",k:158,g:"主食"},
    {n:"おにぎり(鮭)",k:180,g:"主食"},
    {n:"うどん 1玉",k:242,g:"主食"},
    {n:"そば 1人前",k:296,g:"主食"},
    {n:"パスタ(乾100g)",k:378,g:"主食"},
    {n:"ラーメン 1杯",k:500,g:"主食"},
    {n:"チャーハン 1皿",k:650,g:"主食"},
    {n:"カレーライス 1皿",k:700,g:"主食"},
    {n:"牛丼 並",k:650,g:"主食"},
    {n:"寿司 1人前(10貫)",k:500,g:"主食"},
    // 主菜
    {n:"卵 1個",k:76,g:"主菜"},
    {n:"納豆 1パック",k:100,g:"主菜"},
    {n:"鶏むね肉 皮なし150g",k:162,g:"主菜"},
    {n:"鶏もも肉 150g",k:300,g:"主菜"},
    {n:"サラダチキン 1個",k:110,g:"主菜"},
    {n:"鮭の塩焼き 1切れ",k:150,g:"主菜"},
    {n:"さばの味噌煮 1切れ",k:250,g:"主菜"},
    {n:"豚のしょうが焼き 1人前",k:350,g:"主菜"},
    {n:"ハンバーグ 1個",k:400,g:"主菜"},
    {n:"唐揚げ 3個",k:290,g:"主菜"},
    {n:"餃子 5個",k:250,g:"主菜"},
    {n:"豆腐 半丁",k:110,g:"主菜"},
    // 副菜・汁物
    {n:"味噌汁 1杯",k:40,g:"副菜"},
    {n:"豚汁 1杯",k:130,g:"副菜"},
    {n:"サラダ(ドレッシングなし)",k:25,g:"副菜"},
    {n:"サラダ(ドレッシングあり)",k:90,g:"副菜"},
    {n:"ほうれん草のおひたし",k:25,g:"副菜"},
    {n:"きんぴらごぼう",k:110,g:"副菜"},
    {n:"ポテトサラダ",k:170,g:"副菜"},
    {n:"冷奴",k:60,g:"副菜"},
    {n:"枝豆 1皿",k:80,g:"副菜"},
    // 飲みもの
    {n:"コーヒー(ブラック)",k:8,g:"飲みもの"},
    {n:"カフェラテ",k:110,g:"飲みもの"},
    {n:"緑茶",k:0,g:"飲みもの"},
    {n:"オレンジジュース 200ml",k:84,g:"飲みもの"},
    {n:"牛乳 200ml",k:138,g:"飲みもの"},
    {n:"ビール 350ml",k:140,g:"飲みもの"},
    {n:"ハイボール 1杯",k:70,g:"飲みもの"},
    {n:"赤ワイン 1杯",k:90,g:"飲みもの"},
    {n:"日本酒 1合",k:195,g:"飲みもの"},
    {n:"コーラ 500ml",k:225,g:"飲みもの"},
    // おやつ
    {n:"バナナ 1本",k:86,g:"おやつ"},
    {n:"りんご 半分",k:70,g:"おやつ"},
    {n:"ヨーグルト(無糖)",k:62,g:"おやつ"},
    {n:"チョコレート 1かけ",k:30,g:"おやつ"},
    {n:"ポテトチップス 60g",k:336,g:"おやつ"},
    {n:"アイスクリーム 1個",k:200,g:"おやつ"},
    {n:"どら焼き 1個",k:240,g:"おやつ"},
    {n:"プリン 1個",k:130,g:"おやつ"},
    {n:"せんべい 1枚",k:46,g:"おやつ"},
    {n:"ナッツ 25g",k:150,g:"おやつ"}
  ];

  var SLOTS = [
    {k:"breakfast", ja:"朝食",  en:"BREAKFAST", groups:["主食","主菜","飲みもの","副菜"]},
    {k:"lunch",     ja:"昼食",  en:"LUNCH",     groups:["主食","主菜","副菜"]},
    {k:"dinner",    ja:"夕食",  en:"DINNER",    groups:["主菜","主食","副菜","飲みもの"]},
    {k:"snack",     ja:"間食",  en:"SNACK",     groups:["おやつ","飲みもの"]}
  ];
  var SLOT_SHORT = {breakfast:"朝", lunch:"昼", dinner:"夕", snack:"間食"};
  var WEEK = ["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"];
  var WEEK_S = ["日","月","火","水","木","金","土"];
  var LS_KEY = "calorie-note-v1";

  /* ---------------- state ---------------- */
  var state = {
    db: null,
    mode: "loading",     // loading | cloud | local
    target: 2000,
    days: {},            // "YYYY-MM-DD" -> {date, items:[{id,slot,name,kcal,at}]}
    sel: dateKey(new Date()),
    migrated: false
  };
  var ui = { open:null, q:"", kcal:"" };

  /* ---------------- helpers ---------------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function dateKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parseKey(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function shiftKey(s, n){ var d = parseKey(s); d.setDate(d.getDate() + n); return dateKey(d); }
  function fmt(n){ return Math.round(n).toLocaleString("ja-JP"); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function el(id){ return document.getElementById(id); }

  function dayOf(key){ return state.days[key] || {date:key, items:[]}; }
  function itemsOf(key){
    if (isDemo()) return DEMO[key] ? DEMO[key].items : [];
    return dayOf(key).items;
  }
  function totalOf(key){
    return itemsOf(key).reduce(function(s,i){ return s + (+i.kcal || 0); }, 0);
  }
  function hasAnyData(){
    for (var k in state.days){ if (state.days[k].items && state.days[k].items.length) return true; }
    return false;
  }
  function isDemo(){ return state.mode !== "loading" && !hasAnyData(); }

  /* ---------------- サンプル表示（記録が1件もないときだけ） ---------------- */
  var DEMO = (function(){
    var out = {};
    var today = dateKey(new Date());
    out[today] = {date:today, items:[
      {id:"d1", slot:"breakfast", name:"食パン 6枚切1枚", kcal:158},
      {id:"d2", slot:"breakfast", name:"卵 1個", kcal:76},
      {id:"d3", slot:"breakfast", name:"コーヒー(ブラック)", kcal:8},
      {id:"d4", slot:"lunch", name:"おにぎり(鮭)", kcal:180},
      {id:"d5", slot:"lunch", name:"豚汁 1杯", kcal:130},
      {id:"d6", slot:"lunch", name:"サラダチキン 1個", kcal:110},
      {id:"d7", slot:"dinner", name:"ご飯 茶碗1杯(150g)", kcal:234},
      {id:"d8", slot:"dinner", name:"鮭の塩焼き 1切れ", kcal:150},
      {id:"d9", slot:"dinner", name:"ほうれん草のおひたし", kcal:25},
      {id:"d10", slot:"dinner", name:"味噌汁 1杯", kcal:40},
      {id:"d11", slot:"snack", name:"ヨーグルト(無糖)", kcal:62},
      {id:"d12", slot:"snack", name:"バナナ 1本", kcal:86}
    ]};
    var past = [1720, 1980, 1450, 2130, 1670, 1880];
    for (var i = 1; i <= 6; i++){
      var k = shiftKey(today, -i);
      out[k] = {date:k, items:[{id:"p"+i, slot:"dinner", name:"サンプル", kcal:past[i-1]}]};
    }
    return out;
  })();

  /* ---------------- 保存 ---------------- */
  function saveLocal(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({target:state.target, days:state.days}));
    }catch(e){}
  }
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || typeof o !== "object") return null;
      return o;
    }catch(e){ return null; }
  }
  function persistDay(key){
    var day = dayOf(key);
    if (state.db){
      state.db.doc("days/" + key).set({date:day.date, items:day.items}).catch(function(err){
        flash("保存できませんでした（" + (err && err.code ? err.code : "error") + "）");
      });
    } else {
      saveLocal();
    }
  }
  function persistTarget(){
    if (state.db){
      state.db.doc("settings/main").set({targetKcal:state.target}).catch(function(){
        flash("目標を保存できませんでした");
      });
    } else {
      saveLocal();
    }
  }
  var msgTimer = null;
  function flash(text){
    el("msg").textContent = text;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function(){ el("msg").textContent = ""; }, 4000);
  }

  /* ---------------- 記録の追加・削除 ---------------- */
  function addItem(slot, name, kcal){
    name = String(name || "").trim();
    kcal = Math.round(+kcal);
    if (!name || !isFinite(kcal) || kcal < 0) return;
    var key = state.sel;
    var day = state.days[key] || {date:key, items:[]};
    day.items = day.items.concat([{id:uid(), slot:slot, name:name, kcal:kcal, at:new Date().toISOString()}]);
    state.days[key] = day;
    ui.q = ""; ui.kcal = ""; ui.open = slot;
    persistDay(key);
    render();
    focusName(slot);
  }
  function removeItem(id){
    var key = state.sel;
    var day = state.days[key];
    if (!day) return;
    day.items = day.items.filter(function(i){ return i.id !== id; });
    state.days[key] = day;
    persistDay(key);
    render();
  }

  /* ---------------- 候補 ---------------- */
  function frequentFoods(){
    var counts = {}, kcals = {};
    var from = shiftKey(state.sel, -30);
    for (var k in state.days){
      if (k < from || k > state.sel) continue;
      (state.days[k].items || []).forEach(function(i){
        counts[i.name] = (counts[i.name] || 0) + 1;
        kcals[i.name] = i.kcal;
      });
    }
    return Object.keys(counts)
      .filter(function(n){ return counts[n] >= 2; })
      .sort(function(a,b){ return counts[b] - counts[a]; })
      .slice(0, 6)
      .map(function(n){ return {n:n, k:kcals[n], freq:true}; });
  }
  function suggestFor(slot, q){
    q = (q || "").trim();
    if (q){
      return CATALOG.filter(function(f){ return f.n.indexOf(q) >= 0 || f.g.indexOf(q) >= 0; }).slice(0, 8);
    }
    var freq = frequentFoods();
    var conf = SLOTS.filter(function(s){ return s.k === slot; })[0];
    var byGroup = [];
    conf.groups.forEach(function(g){
      CATALOG.filter(function(f){ return f.g === g; }).slice(0, 3).forEach(function(f){ byGroup.push(f); });
    });
    var used = {};
    var out = [];
    freq.concat(byGroup).forEach(function(f){
      if (used[f.n]) return;
      used[f.n] = 1;
      out.push(f);
    });
    return out.slice(0, 8);
  }

  /* ---------------- 描画 ---------------- */
  function render(){
    var key = state.sel;
    var todayK = dateKey(new Date());
    var demo = isDemo();
    var items = itemsOf(key);
    var total = totalOf(key);
    var target = state.target;
    var diff = target - total;

    // 日付
    var d = parseKey(key);
    el("dateMain").textContent = (d.getMonth()+1) + "月" + d.getDate() + "日";
    el("dateSub").textContent = WEEK[d.getDay()] + (key === todayK ? "・今日" : "");
    el("nextDay").disabled = key >= todayK;
    el("todayBtn").hidden = key === todayK;
    el("demoBanner").hidden = !demo;

    // 合計
    el("totalKcal").textContent = fmt(total);
    el("itemCount").textContent = items.length + " 品";
    el("targetVal").textContent = fmt(target) + " kcal";
    el("goalBtnVal").textContent = fmt(target) + " kcal";
    var rrow = el("remainRow");
    rrow.className = "frow big " + (diff >= 0 ? "under" : "over");
    el("remainLabel").textContent = diff >= 0 ? "残り" : "超過";
    el("remainVal").textContent = fmt(Math.abs(diff)) + " kcal";
    var pct = target > 0 ? Math.min(total / target, 1) * 100 : 0;
    el("budgetFill").style.width = pct.toFixed(1) + "%";
    el("budget").className = "budget" + (diff < 0 ? " is-over" : "");

    var bd = SLOTS.map(function(s){
      var v = items.filter(function(i){ return i.slot === s.k; })
                   .reduce(function(a,i){ return a + (+i.kcal || 0); }, 0);
      return '<span>' + SLOT_SHORT[s.k] + ' <b class="num">' + fmt(v) + '</b></span>';
    }).join("");
    el("breakdown").innerHTML = bd;

    // 食事セクション
    el("meals").innerHTML = SLOTS.map(function(s){
      var list = items.filter(function(i){ return i.slot === s.k; });
      var sub = list.reduce(function(a,i){ return a + (+i.kcal || 0); }, 0);
      var rows = list.map(function(i){
        return '<li><span class="nm">' + esc(i.name) + '</span>' +
               '<span class="kc num">' + fmt(i.kcal) + '<em>kcal</em></span>' +
               (demo ? '<span></span>' : '<button class="del" data-del="' + esc(i.id) + '" aria-label="' + esc(i.name) + 'を削除">×</button>') +
               '</li>';
      }).join("");
      var body = list.length
        ? '<ul class="items">' + rows + '</ul>'
        : '<p class="empty">まだ記録がありません</p>';
      var form = "";
      if (ui.open === s.k){
        var sug = suggestFor(s.k, ui.q).map(function(f){
          return '<button class="chip' + (f.freq ? ' freq' : '') + '" data-add="' + esc(f.n) + '" data-kcal="' + f.k + '">' +
                 esc(f.n) + '<span class="c num">' + f.k + '</span></button>';
        }).join("");
        form =
          '<div class="addform">' +
            '<div class="manual">' +
              '<input type="text" data-field="name" data-slot="' + s.k + '" placeholder="食べたもの" value="' + esc(ui.q) + '" autocomplete="off">' +
              '<input type="number" data-field="kcal" data-slot="' + s.k + '" placeholder="kcal" inputmode="numeric" min="0" step="1" value="' + esc(ui.kcal) + '">' +
              '<button data-submit="' + s.k + '">記録</button>' +
            '</div>' +
            '<div class="sug">' + sug + '</div>' +
            '<p class="hint">候補をタップするとそのまま記録できます。名前を入力すると一覧から探します。</p>' +
          '</div>';
      }
      return '<article class="meal' + (demo ? ' is-demo' : '') + '">' +
        '<div class="meal-head">' +
          '<h2>' + s.ja + '<span class="en">' + s.en + '</span></h2>' +
          '<span class="k num' + (sub ? '' : ' zero') + '">' + fmt(sub) + '<em>kcal</em></span>' +
        '</div>' + body +
        '<button class="add-btn" data-open="' + s.k + '">' + (ui.open === s.k ? '＋ ' + s.ja + 'を記録中' : '＋ ' + s.ja + 'を追加') + '</button>' +
        form +
      '</article>';
    }).join("");

    renderChart();
  }

  function renderChart(){
    var W = 360, H = 138, padL = 8, padR = 8, top = 20, base = 100;
    var keys = [];
    for (var i = 6; i >= 0; i--) keys.push(shiftKey(state.sel, -i));
    var totals = keys.map(totalOf);
    var recorded = totals.filter(function(t){ return t > 0; });
    var avg = recorded.length ? recorded.reduce(function(a,b){ return a+b; }, 0) / recorded.length : 0;

    el("avgVal").innerHTML = (recorded.length ? '<span class="num">' + fmt(avg) + '</span>' : "—") +
      ' <em>平均 kcal / 記録' + recorded.length + '日</em>';

    var maxV = Math.max.apply(null, totals.concat([state.target, 1]));
    var scale = maxV * 1.2;
    var step = (W - padL - padR) / 7;
    var bw = Math.min(30, step - 12);
    var h = base - top;

    var parts = [];
    // 目標線
    var ty = base - (state.target / scale) * h;
    parts.push('<line x1="' + padL + '" y1="' + ty.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + ty.toFixed(1) +
      '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" />');
    parts.push('<text x="' + (W - padR) + '" y="' + (ty - 5).toFixed(1) + '" text-anchor="end" font-size="9" font-weight="700" fill="var(--muted)">目標 ' + fmt(state.target) + '</text>');

    keys.forEach(function(k, i){
      var t = totals[i];
      var bh = scale > 0 ? (t / scale) * h : 0;
      var x = padL + step * i + (step - bw) / 2;
      var y = base - bh;
      var isSel = (k === state.sel);
      var over = t > state.target;
      var fill = over ? "var(--warn)" : "var(--accent)";
      if (t > 0){
        parts.push('<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(bh,1).toFixed(1) +
          '" rx="1.5" fill="' + fill + '" fill-opacity="' + (isSel ? "1" : "0.42") + '" />');
        parts.push('<text x="' + (x + bw/2).toFixed(1) + '" y="' + Math.max(y - 5, 10).toFixed(1) +
          '" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)" fill-opacity="' + (isSel ? "1" : "0.55") + '">' + fmt(t) + '</text>');
      } else {
        parts.push('<rect x="' + x.toFixed(1) + '" y="' + (base - 2) + '" width="' + bw.toFixed(1) + '" height="2" fill="var(--hair)" />');
      }
      var dd = parseKey(k);
      parts.push('<text x="' + (x + bw/2).toFixed(1) + '" y="' + (base + 15) +
        '" text-anchor="middle" font-size="9.5" font-weight="' + (isSel ? "700" : "500") + '" fill="' + (isSel ? "var(--ink)" : "var(--muted)") + '">' +
        (dd.getMonth()+1) + '/' + dd.getDate() + '</text>');
      parts.push('<text x="' + (x + bw/2).toFixed(1) + '" y="' + (base + 27) +
        '" text-anchor="middle" font-size="8.5" fill="var(--muted)">' + WEEK_S[dd.getDay()] + '</text>');
    });
    parts.push('<line x1="' + padL + '" y1="' + base + '" x2="' + (W - padR) + '" y2="' + base + '" stroke="var(--hair)" stroke-width="1" />');

    el("chart").innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="直近7日間の合計カロリー">' + parts.join("") + '</svg>';
  }

  function focusName(slot){
    var input = document.querySelector('input[data-field="name"][data-slot="' + slot + '"]');
    if (input) input.focus();
  }

  /* ---------------- イベント ---------------- */
  el("prevDay").addEventListener("click", function(){ state.sel = shiftKey(state.sel, -1); ui.open = null; render(); });
  el("nextDay").addEventListener("click", function(){ state.sel = shiftKey(state.sel, 1); ui.open = null; render(); });
  el("todayBtn").addEventListener("click", function(){ state.sel = dateKey(new Date()); ui.open = null; render(); });

  el("goalBtn").addEventListener("click", function(){
    var s = el("settings");
    s.hidden = !s.hidden;
    this.setAttribute("aria-expanded", String(!s.hidden));
    if (!s.hidden){ el("targetInput").value = state.target; el("targetInput").focus(); }
  });
  el("targetSave").addEventListener("click", function(){
    var v = Math.round(+el("targetInput").value);
    if (!isFinite(v) || v < 500 || v > 6000){ flash("目標は500〜6000 kcalで入力してください"); return; }
    state.target = v;
    persistTarget();
    el("settings").hidden = true;
    el("goalBtn").setAttribute("aria-expanded", "false");
    render();
    flash("目標を " + fmt(v) + " kcal にしました");
  });
  el("targetInput").addEventListener("keydown", function(e){ if (e.key === "Enter") el("targetSave").click(); });

  el("meals").addEventListener("click", function(e){
    var t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.open){
      ui.open = (ui.open === t.dataset.open) ? null : t.dataset.open;
      ui.q = ""; ui.kcal = "";
      render();
      if (ui.open) focusName(ui.open);
      return;
    }
    if (t.dataset.add){ addItem(ui.open, t.dataset.add, t.dataset.kcal); return; }
    if (t.dataset.submit){
      var slot = t.dataset.submit;
      addItem(slot, ui.q, ui.kcal);
      return;
    }
    if (t.dataset.del){ removeItem(t.dataset.del); return; }
  });

  el("meals").addEventListener("input", function(e){
    var f = e.target.dataset ? e.target.dataset.field : null;
    if (f === "name"){
      ui.q = e.target.value;
      var box = e.target.closest(".addform").querySelector(".sug");
      box.innerHTML = suggestFor(e.target.dataset.slot, ui.q).map(function(x){
        return '<button class="chip' + (x.freq ? ' freq' : '') + '" data-add="' + esc(x.n) + '" data-kcal="' + x.k + '">' +
               esc(x.n) + '<span class="c num">' + x.k + '</span></button>';
      }).join("");
    } else if (f === "kcal"){
      ui.kcal = e.target.value;
    }
  });

  el("meals").addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    var f = e.target.dataset ? e.target.dataset.field : null;
    if (f === "name"){ e.preventDefault(); e.target.closest(".addform").querySelector('input[data-field="kcal"]').focus(); }
    else if (f === "kcal"){ e.preventDefault(); addItem(e.target.dataset.slot, ui.q, ui.kcal); }
  });

  /* ---------------- 起動 ---------------- */
  function setStorage(mode){
    state.mode = mode;
    var s = el("storageState"), n = el("storageNote");
    if (mode === "cloud"){
      s.innerHTML = '<span class="dot"></span>クラウドに保存中';
      n.textContent = "記録はこのページに保存され、別の端末で開いても同じ内容が表示されます。";
    } else {
      s.innerHTML = '<span class="dot" style="background:var(--muted)"></span>このブラウザに保存中';
      n.textContent = "このページの保存機能が使えないため、記録はこの端末のブラウザにだけ保存されます。";
    }
  }

  // まずローカルの内容で描画（クラウドが来たら差し替え）
  var local = loadLocal();
  if (local){
    if (local.target) state.target = local.target;
    if (local.days) state.days = local.days;
  }
  setStorage("local");
  render();

  if (window.claude && typeof window.claude.use === "function"){
    el("storageState").innerHTML = '<span class="dot" style="background:var(--muted)"></span>保存先を確認中…';
    window.claude.use("db").then(function(db){
      if (!db){ setStorage("local"); render(); return; }
      state.db = db;
      setStorage("cloud");

      db.doc("settings/main").onSnapshot(function(snap){
        if (snap.exists){
          var v = snap.data() || {};
          if (typeof v.targetKcal === "number") state.target = v.targetKcal;
        } else if (local && local.target){
          db.doc("settings/main").set({targetKcal:local.target}).catch(function(){});
        }
        render();
      }, function(){});

      db.collection("days").orderBy("date", "desc").limit(120).onSnapshot(function(snap){
        var next = {};
        snap.docs.forEach(function(doc){
          var v = doc.data() || {};
          next[doc.id] = {date: v.date || doc.id, items: Array.isArray(v.items) ? v.items : []};
        });
        state.days = next;

        // 端末に残っていた記録をクラウドへ引き上げる（消さない・上書きしない）
        if (!state.migrated){
          state.migrated = true;
          if (local && local.days){
            Object.keys(local.days).forEach(function(k){
              var d = local.days[k];
              if (!d || !d.items || !d.items.length) return;
              if (next[k] && next[k].items.length) return;
              state.days[k] = {date:k, items:d.items};
              db.doc("days/" + k).set({date:k, items:d.items}).catch(function(){});
            });
          }
        }
        render();
      }, function(e){
        flash("読み込みに問題が起きました（" + (e && e.code ? e.code : "error") + "）");
      });
    }).catch(function(){ setStorage("local"); render(); });
  }
})();
</script>
