<title>カロリーノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F3F4EF;
    --card:#FFFFFF;
    --ink:#171B16;
    --muted:#6E756B;
    --hair:#D6D9D0;
    --rule:#171B16;
    --accent:#37694A;
    --accent-soft:#DEE9E0;
    --warn:#A8542C;
    --warn-soft:#F1E0D5;
    --shadow:0 1px 0 rgba(23,27,22,.06), 0 6px 22px -14px rgba(23,27,22,.5);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121510;
      --card:#1A1E18;
      --ink:#E9EDE4;
      --muted:#98A092;
      --hair:#2E3429;
      --rule:#E9EDE4;
      --accent:#8CC49B;
      --accent-soft:#233127;
      --warn:#E09A6E;
      --warn-soft:#3A2A20;
      --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px #000;
    }
  }
  :root[data-theme="dark"]{
    --paper:#121510;
    --card:#1A1E18;
    --ink:#E9EDE4;
    --muted:#98A092;
    --hair:#2E3429;
    --rule:#E9EDE4;
    --accent:#8CC49B;
    --accent-soft:#233127;
    --warn:#E09A6E;
    --warn-soft:#3A2A20;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px #000;
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Archivo","Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  .wrap{max-width:540px;margin:0 auto;padding:20px 18px 56px;display:flex;flex-direction:column;gap:18px}

  /* ---- header ---- */
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .brand{display:flex;flex-direction:column;gap:1px}
  .brand b{font-size:21px;font-weight:700;letter-spacing:.01em}
  .goal-btn{
    display:flex;flex-direction:column;align-items:flex-end;gap:1px;
    padding:6px 10px;border:1px solid var(--hair);border-radius:3px;background:var(--card);
  }
  .goal-btn .v{font-size:15px;font-weight:700}
  .goal-btn:hover{border-color:var(--accent)}

  .settings{
    border:1px solid var(--hair);background:var(--card);border-radius:3px;padding:14px;
    display:flex;flex-direction:column;gap:11px;
  }
  .settings .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .settings label{font-size:13.5px;font-weight:700;min-width:9.5em}
  .settings input{
    width:104px;padding:8px 10px;border:1px solid var(--hair);border-radius:2px;
    background:var(--paper);text-align:right;font-variant-numeric:tabular-nums;font-weight:600;
  }
  .settings .unit{font-size:12px;color:var(--muted)}
  .settings .note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
  .btn-primary{padding:8px 14px;background:var(--accent);color:var(--paper);border-radius:2px;font-size:13px;font-weight:700}

  .banner{
    display:flex;gap:8px;align-items:baseline;
    padding:9px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);
    font-size:12.5px;border-radius:0 3px 3px 0;
  }
  .banner b{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

  /* ---- date nav ---- */
  .daynav{display:flex;align-items:center;gap:6px}
  .daynav .arrow{
    width:34px;height:34px;border:1px solid var(--hair);border-radius:2px;background:var(--card);
    font-size:17px;line-height:1;display:grid;place-items:center;
  }
  .daynav .arrow:disabled{opacity:.32;cursor:default}
  .daynav .arrow:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
  .daylabel{flex:1;display:flex;align-items:baseline;gap:8px;padding-left:4px}
  .daylabel .d{font-size:19px;font-weight:700}
  .daylabel .w{font-size:12px;color:var(--muted)}
  .today-btn{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);border:1px solid var(--accent);border-radius:2px;padding:5px 8px}

  /* ---- facts ---- */
  .facts{background:var(--card);border:1px solid var(--hair);border-radius:3px;padding:14px 16px 16px;box-shadow:var(--shadow)}
  .facts-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .facts-total{display:flex;align-items:baseline;gap:6px}
  .facts-total .n{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .facts-total .u{font-size:13px;font-weight:600;color:var(--muted)}
  .rule-thick{height:6px;background:var(--rule);margin-top:10px}
  .frow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
  .frow .k{color:var(--muted)}
  .frow .v{font-weight:700;font-variant-numeric:tabular-nums}
  .frow.big .v{font-size:16px}
  .frow.over .v{color:var(--warn)}
  .frow.under .v{color:var(--accent)}
  .frow.burn .v{color:var(--accent)}
  .budget{position:relative;height:9px;margin-top:12px;background:var(--paper);border:1px solid var(--hair);border-radius:99px;overflow:hidden}
  .budget .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .budget.is-over .fill{background:var(--warn)}
  .breakdown{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:11px;font-size:12px;color:var(--muted)}
  .breakdown b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

  /* ---- weight strip ---- */
  .weightbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
    background:var(--card);border:1px solid var(--hair);border-radius:3px;padding:11px 14px;
  }
  .wfield{display:flex;align-items:baseline;gap:6px}
  .wfield label{font-size:12px;font-weight:700;color:var(--muted)}
  .wfield input{
    width:78px;padding:6px 8px;border:1px solid var(--hair);border-radius:2px;background:var(--paper);
    text-align:right;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .wfield .u{font-size:11px;color:var(--muted)}
  .wdelta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:11.5px;color:var(--muted);text-align:right}
  .wdelta b{font-weight:700;font-variant-numeric:tabular-nums}
  .wdelta .down{color:var(--accent)}
  .wdelta .up{color:var(--warn)}

  /* ---- logs (meals + exercise) ---- */
  .logs{display:flex;flex-direction:column;gap:2px}
  .meal{border-top:1px solid var(--hair);padding:12px 2px 10px}
  .meal.last{border-bottom:1px solid var(--hair)}
  .meal-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .meal-head h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
  .meal-head .en{font-size:9.5px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .meal-head .k{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .meal-head .k em{font-style:normal;font-size:10px;color:var(--muted);margin-left:3px;font-weight:500}
  .meal-head .k.zero{color:var(--muted);font-weight:500}
  .meal-head .k.burn{color:var(--accent)}
  .items{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
  .items li{display:grid;grid-template-columns:1fr auto 26px;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dotted var(--hair);font-size:14px}
  .items .nm{overflow-wrap:anywhere}
  .items .nm small{color:var(--muted);font-size:11.5px;margin-left:6px}
  .items .kc{font-weight:700;font-variant-numeric:tabular-nums}
  .items .kc em{font-style:normal;font-size:10px;color:var(--muted);margin-left:2px;font-weight:500}
  .items .del{color:var(--muted);font-size:15px;line-height:1;justify-self:end;padding:2px 5px;border-radius:2px}
  .items .del:hover{color:var(--warn);background:var(--warn-soft)}
  .is-demo .items li{color:var(--muted)}
  .add-btn{margin-top:9px;font-size:12.5px;font-weight:700;color:var(--accent);border:1px dashed var(--hair);border-radius:2px;padding:7px 11px;width:100%;text-align:left}
  .add-btn:hover{border-color:var(--accent);background:var(--accent-soft)}

  .addform{margin-top:10px;display:flex;flex-direction:column;gap:9px}
  .sug{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--hair);background:var(--card);border-radius:99px;padding:5px 11px;font-size:12.5px}
  .chip .c{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
  .chip:hover{border-color:var(--accent);background:var(--accent-soft)}
  .chip.freq{border-color:var(--accent)}
  .manual{display:grid;grid-template-columns:1fr 84px auto;gap:6px}
  .manual.ex{grid-template-columns:1fr}
  .manual2{display:grid;grid-template-columns:74px 84px 1fr;gap:6px;align-items:end}
  .mini{display:flex;flex-direction:column;gap:2px}
  .mini span{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
  .manual input,.manual2 input{padding:9px 10px;border:1px solid var(--hair);border-radius:2px;background:var(--card);min-width:0}
  .manual input[type="number"],.manual2 input[type="number"]{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .manual button,.manual2 button{padding:0 14px;height:38px;background:var(--accent);color:var(--paper);border-radius:2px;font-size:13px;font-weight:700}
  .hint{font-size:11.5px;color:var(--muted);margin:0}
  .empty{font-size:12.5px;color:var(--muted);padding:6px 0 0;margin:0}

  /* ---- charts ---- */
  .history{border:1px solid var(--hair);background:var(--card);border-radius:3px;padding:12px 12px 10px}
  .tabs{display:flex;gap:4px;padding:0 2px 10px}
  .tab{font-size:12px;font-weight:700;padding:6px 12px;border:1px solid var(--hair);border-radius:99px;color:var(--muted)}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .history-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 6px}
  .history-head .avg{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .history-head .avg em{font-style:normal;font-size:10px;color:var(--muted);font-weight:500;margin-left:3px}
  .history svg{display:block;width:100%;height:auto;overflow:visible}
  .chart-note{font-size:11.5px;color:var(--muted);padding:2px 4px 0;margin:0}

  /* ---- 表示切り替え ---- */
  .viewswitch{display:flex;gap:4px;align-self:flex-start}
  .viewswitch button{border:1px solid var(--hair);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--muted);background:var(--card)}
  .viewswitch button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---- 週まとめ ---- */
  .weekly{display:flex;flex-direction:column;gap:16px}
  .wk-tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:3px;overflow:hidden}
  .wk-tile{background:var(--card);padding:12px 13px;display:flex;flex-direction:column;gap:2px;min-height:78px}
  .wk-tile .n{font-size:24px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .wk-tile .n em{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);margin-left:3px}
  .wk-tile .s{font-size:11px;color:var(--muted);line-height:1.4}
  .wk-tile .n.good{color:var(--accent)}
  .wk-tile .n.bad{color:var(--warn)}

  .wk-block{display:flex;flex-direction:column;gap:8px}
  .wk-block h3{margin:0;font-size:13px;font-weight:700;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .wk-block h3 span{font-size:11px;font-weight:500;color:var(--muted)}
  .wk-scroll{overflow-x:auto}
  .wk-table{width:100%;border-collapse:collapse;font-size:13px}
  .wk-table th{
    font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;
    text-align:right;padding:0 0 5px;border-bottom:2px solid var(--rule);white-space:nowrap;
  }
  .wk-table th:first-child{text-align:left}
  .wk-table td{padding:7px 0;border-bottom:1px solid var(--hair);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wk-table th+th,.wk-table td+td{padding-left:13px}
  .wk-table td:first-child{text-align:left;font-weight:700}
  .wk-table td small{font-weight:500;color:var(--muted);font-size:11px;margin-left:4px}
  .wk-table tr.today td{background:var(--accent-soft)}
  .wk-table tr.blank td{color:var(--muted)}
  .wk-table .bar{position:relative;padding-right:8px;min-width:74px}
  .wk-table .bar i{position:absolute;left:0;bottom:4px;height:4px;background:var(--accent);opacity:.5;border-radius:99px}
  .wk-table .bar i.over{background:var(--warn);opacity:.55}
  .wk-table .bar b{position:relative;font-weight:700}
  .wk-table .pos{color:var(--warn);font-weight:700}
  .wk-table .neg{color:var(--accent);font-weight:700}

  .wk-rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .wk-rank li{display:grid;grid-template-columns:1.4em 1fr auto auto;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--hair);font-size:13.5px}
  .wk-rank .r{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .wk-rank .c{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .wk-rank .k{font-weight:700;font-variant-numeric:tabular-nums}
  .wk-rank .k em{font-style:normal;font-size:10px;color:var(--muted);margin-left:2px;font-weight:500}

  .wk-notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .wk-notes li{display:flex;gap:9px;font-size:13.5px;line-height:1.55}
  .wk-notes li::before{content:"";flex:none;width:3px;border-radius:99px;background:var(--accent);align-self:stretch}
  .wk-notes b{font-weight:700;font-variant-numeric:tabular-nums}
  .wk-empty{font-size:13px;color:var(--muted);padding:14px;border:1px dashed var(--hair);border-radius:3px;text-align:center;margin:0}

  /* ---- 写真から記録 ---- */
  .photo-cta{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:12px 14px;border:1px solid var(--accent);background:var(--accent-soft);
    border-radius:3px;text-align:left;
  }
  .photo-cta .ic{font-size:19px;line-height:1}
  .photo-cta .tx{display:flex;flex-direction:column;gap:1px}
  .photo-cta b{font-size:14px;font-weight:700}
  .photo-cta small{font-size:11.5px;color:var(--muted)}
  .photo-cta:hover{background:var(--card)}
  .photo-mini{
    align-self:flex-start;font-size:12px;font-weight:700;color:var(--accent);
    border:1px solid var(--hair);border-radius:99px;padding:5px 12px;
  }
  .photo-mini:hover{border-color:var(--accent);background:var(--accent-soft)}

  .sheet{position:fixed;inset:0;z-index:20;background:rgba(23,27,22,.5);display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media (min-width:560px){ .sheet{align-items:center;padding:20px} }
  .sheet-card{
    width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);
    border:1px solid var(--hair);border-radius:8px 8px 0 0;padding:16px 16px 20px;
    display:flex;flex-direction:column;gap:12px;
  }
  @media (min-width:560px){ .sheet-card{border-radius:6px} }
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sheet-head b{font-size:16px;font-weight:700}
  .sheet-head button{font-size:20px;line-height:1;color:var(--muted);padding:2px 6px}
  .shot{width:100%;max-height:170px;object-fit:cover;border-radius:3px;border:1px solid var(--hair);display:block}
  .reading{display:flex;flex-direction:column;gap:6px;align-items:center;padding:14px 0}
  .reading b{font-size:14px;font-weight:700}
  .reading small{font-size:11.5px;color:var(--muted)}
  .bar{width:100%;height:4px;background:var(--paper);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:38%;background:var(--accent);border-radius:99px;animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  .slotpick{display:flex;gap:6px;flex-wrap:wrap}
  .slotpick button{border:1px solid var(--hair);border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .slotpick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .detected{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .detected li{display:grid;grid-template-columns:22px 1fr 74px 26px;gap:7px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--hair)}
  .detected input[type="checkbox"]{width:17px;height:17px;accent-color:var(--accent)}
  .detected input[type="text"],.detected input[type="number"]{
    padding:6px 8px;border:1px solid var(--hair);border-radius:2px;background:var(--paper);min-width:0;font-size:13.5px;width:100%;
  }
  .detected input[type="number"]{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .detected li.off input[type="text"],.detected li.off input[type="number"]{opacity:.42}
  .detected .del{color:var(--muted);font-size:15px;padding:2px 5px;border-radius:2px;justify-self:end}
  .detected .del:hover{color:var(--warn);background:var(--warn-soft)}
  .detected li.lowc input[type="text"],.detected li.lowc input[type="number"]{border-color:var(--warn);background:var(--warn-soft)}
  .sheet-total{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;padding-top:2px}
  .sheet-total b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .sheet-actions{display:flex;gap:8px}
  .sheet-actions button{flex:1;padding:11px 12px;border-radius:3px;font-size:13.5px;font-weight:700}
  .sheet-actions .ghost{border:1px solid var(--hair);color:var(--muted)}
  .sheet-actions .ghost:hover{border-color:var(--ink);color:var(--ink)}
  .sheet-actions .go{background:var(--accent);color:var(--paper)}
  .sheet-actions .go:disabled{opacity:.45;cursor:default}
  .sheet-note{font-size:11.5px;color:var(--muted);margin:0;line-height:1.55}
  .sheet-err{font-size:13.5px;color:var(--warn);font-weight:700;margin:0}

  footer{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);padding-top:2px}
  .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--accent);margin-right:5px;vertical-align:middle}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}
    .bar i{width:100%}}
</style>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">MEAL &amp; BODY LOG</span>
      <b>カロリーノート</b>
    </div>
    <button class="goal-btn" id="goalBtn" aria-expanded="false">
      <span class="eyebrow">1日の目標</span>
      <span class="v num" id="goalBtnVal">2,000 kcal</span>
    </button>
  </header>

  <section class="settings" id="settings" hidden>
    <div class="row">
      <label for="targetInput">1日の目標カロリー</label>
      <input id="targetInput" type="number" inputmode="numeric" min="500" max="6000" step="10" value="2000">
      <span class="unit">kcal</span>
    </div>
    <div class="row">
      <label for="targetWeightInput">目標体重</label>
      <input id="targetWeightInput" type="number" inputmode="decimal" min="20" max="300" step="0.1" placeholder="未設定">
      <span class="unit">kg</span>
    </div>
    <div class="row">
      <button class="btn-primary" id="targetSave">保存</button>
      <span class="unit" id="metNote"></span>
    </div>
    <p class="note" id="storageNote">保存先を確認しています…</p>
  </section>

  <div class="banner" id="demoBanner" hidden>
    <b>Sample</b>
    <span>サンプル表示です。最初の記録を追加すると消えます。</span>
  </div>

  <div class="viewswitch">
    <button id="viewDay" aria-pressed="true">日ごと</button>
    <button id="viewWeek" aria-pressed="false">週まとめ</button>
  </div>

  <section class="daynav">
    <button class="arrow" id="prevDay" aria-label="前へ">‹</button>
    <div class="daylabel">
      <span class="d" id="dateMain">—</span>
      <span class="w" id="dateSub"></span>
    </div>
    <button class="today-btn" id="todayBtn" hidden>今日へ</button>
    <button class="arrow" id="nextDay" aria-label="次へ">›</button>
  </section>

  <section class="weightbar" id="weightbar">
    <div class="wfield">
      <label for="weightInput">体重</label>
      <input id="weightInput" type="number" inputmode="decimal" min="20" max="300" step="0.1" placeholder="--">
      <span class="u">kg</span>
    </div>
    <div class="wfield">
      <label for="fatInput">体脂肪</label>
      <input id="fatInput" type="number" inputmode="decimal" min="1" max="70" step="0.1" placeholder="--">
      <span class="u">%</span>
    </div>
    <div class="wdelta" id="wdelta"></div>
  </section>

  <button class="photo-cta" id="photoCta" hidden>
    <span class="ic">📷</span>
    <span class="tx">
      <b>写真から記録する</b>
      <small>食事の写真を撮ると、料理とカロリーを読み取って候補にします</small>
    </span>
  </button>

  <section class="facts" id="facts">
    <div class="facts-top">
      <div>
        <div class="eyebrow">この日に食べた分</div>
        <div class="facts-total"><span class="n num" id="totalKcal">0</span><span class="u">kcal</span></div>
      </div>
      <div style="text-align:right">
        <div class="eyebrow">記録</div>
        <div class="num" style="font-size:15px;font-weight:700" id="itemCount">0 品</div>
      </div>
    </div>
    <div class="rule-thick"></div>
    <div class="frow"><span class="k">目標</span><span class="v num" id="targetVal">2,000 kcal</span></div>
    <div class="frow burn" id="burnRow" hidden><span class="k">運動で消費</span><span class="v num" id="burnVal">0 kcal</span></div>
    <div class="frow big" id="remainRow"><span class="k" id="remainLabel">残り</span><span class="v num" id="remainVal">2,000 kcal</span></div>
    <div class="budget" id="budget"><div class="fill" id="budgetFill" style="width:0%"></div></div>
    <div class="breakdown" id="breakdown"></div>
  </section>

  <section class="logs" id="logs"></section>

  <section class="weekly" id="weekly" hidden></section>

  <section class="history" id="history">
    <div class="tabs" role="tablist">
      <button class="tab" id="tabKcal" role="tab" aria-selected="true">カロリー 7日</button>
      <button class="tab" id="tabWeight" role="tab" aria-selected="false">体重 30日</button>
    </div>
    <div class="history-head">
      <div class="eyebrow" id="chartTitle">この日までの7日間</div>
      <div class="avg num" id="avgVal"></div>
    </div>
    <div id="chart"></div>
    <p class="chart-note" id="chartNote"></p>
  </section>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <b id="sheetTitle">写真から記録</b>
        <button id="sheetClose" aria-label="閉じる">×</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <input type="file" id="photoInput" accept="image/*" hidden>

  <footer>
    <span id="storageState"><span class="dot"></span>保存先を確認中…</span>
    <span id="msg"></span>
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- 食品カロリー目安（1食あたりの一般的な値） ---------------- */
  var CATALOG = [
    {n:"ご飯 茶碗1杯(150g)",k:234,g:"主食"},
    {n:"ご飯 大盛り(250g)",k:390,g:"主食"},
    {n:"食パン 6枚切1枚",k:158,g:"主食"},
    {n:"おにぎり(鮭)",k:180,g:"主食"},
    {n:"うどん 1玉",k:242,g:"主食"},
    {n:"そば 1人前",k:296,g:"主食"},
    {n:"パスタ(乾100g)",k:378,g:"主食"},
    {n:"ラーメン 1杯",k:500,g:"主食"},
    {n:"チャーハン 1皿",k:650,g:"主食"},
    {n:"カレーライス 1皿",k:700,g:"主食"},
    {n:"牛丼 並",k:650,g:"主食"},
    {n:"寿司 1人前(10貫)",k:500,g:"主食"},
    {n:"卵 1個",k:76,g:"主菜"},
    {n:"納豆 1パック",k:100,g:"主菜"},
    {n:"鶏むね肉 皮なし150g",k:162,g:"主菜"},
    {n:"鶏もも肉 150g",k:300,g:"主菜"},
    {n:"サラダチキン 1個",k:110,g:"主菜"},
    {n:"鮭の塩焼き 1切れ",k:150,g:"主菜"},
    {n:"さばの味噌煮 1切れ",k:250,g:"主菜"},
    {n:"豚のしょうが焼き 1人前",k:350,g:"主菜"},
    {n:"ハンバーグ 1個",k:400,g:"主菜"},
    {n:"唐揚げ 3個",k:290,g:"主菜"},
    {n:"餃子 5個",k:250,g:"主菜"},
    {n:"豆腐 半丁",k:110,g:"主菜"},
    {n:"味噌汁 1杯",k:40,g:"副菜"},
    {n:"豚汁 1杯",k:130,g:"副菜"},
    {n:"サラダ(ドレッシングなし)",k:25,g:"副菜"},
    {n:"サラダ(ドレッシングあり)",k:90,g:"副菜"},
    {n:"ほうれん草のおひたし",k:25,g:"副菜"},
    {n:"きんぴらごぼう",k:110,g:"副菜"},
    {n:"ポテトサラダ",k:170,g:"副菜"},
    {n:"冷奴",k:60,g:"副菜"},
    {n:"枝豆 1皿",k:80,g:"副菜"},
    {n:"コーヒー(ブラック)",k:8,g:"飲みもの"},
    {n:"カフェラテ",k:110,g:"飲みもの"},
    {n:"緑茶",k:0,g:"飲みもの"},
    {n:"オレンジジュース 200ml",k:84,g:"飲みもの"},
    {n:"牛乳 200ml",k:138,g:"飲みもの"},
    {n:"ビール 350ml",k:140,g:"飲みもの"},
    {n:"ハイボール 1杯",k:70,g:"飲みもの"},
    {n:"赤ワイン 1杯",k:90,g:"飲みもの"},
    {n:"日本酒 1合",k:195,g:"飲みもの"},
    {n:"コーラ 500ml",k:225,g:"飲みもの"},
    {n:"バナナ 1本",k:86,g:"おやつ"},
    {n:"りんご 半分",k:70,g:"おやつ"},
    {n:"ヨーグルト(無糖)",k:62,g:"おやつ"},
    {n:"チョコレート 1かけ",k:30,g:"おやつ"},
    {n:"ポテトチップス 60g",k:336,g:"おやつ"},
    {n:"アイスクリーム 1個",k:200,g:"おやつ"},
    {n:"どら焼き 1個",k:240,g:"おやつ"},
    {n:"プリン 1個",k:130,g:"おやつ"},
    {n:"せんべい 1枚",k:46,g:"おやつ"},
    {n:"ナッツ 25g",k:150,g:"おやつ"}
  ];

  /* ---------------- 運動（METs：消費 = METs × 体重kg × 時間h × 1.05） ---------------- */
  var EXERCISES = [
    {n:"ウォーキング",m:3.5},{n:"早歩き",m:4.3},{n:"ジョギング",m:7.0},{n:"ランニング",m:9.8},
    {n:"サイクリング",m:6.8},{n:"エアロバイク",m:7.0},{n:"水泳(クロール)",m:8.3},{n:"なわとび",m:11.8},
    {n:"筋トレ(自重)",m:3.5},{n:"筋トレ(高強度)",m:6.0},{n:"ヨガ",m:2.5},{n:"ストレッチ",m:2.3},
    {n:"階段の昇り降り",m:8.0},{n:"掃除・家事",m:3.3},{n:"ゴルフ",m:4.8},{n:"テニス",m:7.3},
    {n:"バドミントン",m:5.5},{n:"ダンス",m:5.0}
  ];
  var DEFAULT_MET = 4.0;
  var DEFAULT_WEIGHT = 60;

  var SLOTS = [
    {k:"breakfast", ja:"朝食", en:"BREAKFAST", groups:["主食","主菜","飲みもの","副菜"]},
    {k:"lunch",     ja:"昼食", en:"LUNCH",     groups:["主食","主菜","副菜"]},
    {k:"dinner",    ja:"夕食", en:"DINNER",    groups:["主菜","主食","副菜","飲みもの"]},
    {k:"snack",     ja:"間食", en:"SNACK",     groups:["おやつ","飲みもの"]}
  ];
  var SLOT_SHORT = {breakfast:"朝", lunch:"昼", dinner:"夕", snack:"間食"};
  var WEEK = ["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"];
  var WEEK_S = ["日","月","火","水","木","金","土"];
  var LS_KEY = "calorie-note-v1";

  /* ---------------- state ---------------- */
  var state = {
    db:null, mode:"loading", sample:null, imgLimits:null,
    target:2000, targetWeight:null,
    days:{},              // "YYYY-MM-DD" -> {date, items:[], exercise:[], weight, fat}
    sel:dateKey(new Date()),
    migrated:false
  };
  var ui = { open:null, q:"", kcal:"", exName:"", exMin:"30", exKcal:"", exTouched:false, tab:"kcal", view:"day" };
  var photo = { open:false, url:null, blob:null, slot:"lunch", status:"idle", items:[], err:"", ctl:null };

  /* ---------------- helpers ---------------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function dateKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parseKey(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function shiftKey(s,n){ var d = parseKey(s); d.setDate(d.getDate()+n); return dateKey(d); }
  function fmt(n){ return Math.round(n).toLocaleString("ja-JP"); }
  function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function el(id){ return document.getElementById(id); }
  function normDay(o,key){
    o = o || {};
    return {
      date: o.date || key,
      items: Array.isArray(o.items) ? o.items : [],
      exercise: Array.isArray(o.exercise) ? o.exercise : [],
      weight: typeof o.weight === "number" ? o.weight : null,
      fat: typeof o.fat === "number" ? o.fat : null
    };
  }
  function weekStart(key){            // 月曜はじまり
    var d = parseKey(key), wd = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - wd);
    return dateKey(d);
  }
  function weekKeys(startKey){
    var out = [];
    for (var i = 0; i < 7; i++) out.push(shiftKey(startKey, i));
    return out;
  }
  function dayOf(key){ return state.days[key] || normDay(null,key); }
  function viewDay(key){ return isDemo() ? (DEMO[key] || normDay(null,key)) : dayOf(key); }
  function totalOf(key){ return viewDay(key).items.reduce(function(s,i){return s+(+i.kcal||0);},0); }
  function burnOf(key){ return viewDay(key).exercise.reduce(function(s,i){return s+(+i.kcal||0);},0); }
  function hasAnyData(){
    for (var k in state.days){
      var d = state.days[k];
      if ((d.items && d.items.length) || (d.exercise && d.exercise.length) || d.weight != null) return true;
    }
    return false;
  }
  function isDemo(){ return state.mode !== "loading" && !hasAnyData(); }

  // 体重：指定日以前で最も近い記録（なければ以降 → 既定値）
  function weightNear(key){
    var keys = Object.keys(isDemo() ? DEMO : state.days).sort();
    var before = null, after = null;
    for (var i = 0; i < keys.length; i++){
      var w = (isDemo() ? DEMO : state.days)[keys[i]].weight;
      if (w == null) continue;
      if (keys[i] <= key) before = w; else if (after == null) after = w;
    }
    return before != null ? before : (after != null ? after : null);
  }
  function calcWeight(key){ var w = weightNear(key); return w != null ? w : DEFAULT_WEIGHT; }
  function firstWeight(){
    var src = isDemo() ? DEMO : state.days;
    var keys = Object.keys(src).sort();
    for (var i = 0; i < keys.length; i++){ if (src[keys[i]].weight != null) return {k:keys[i], w:src[keys[i]].weight}; }
    return null;
  }
  function prevWeight(key){
    var src = isDemo() ? DEMO : state.days;
    var keys = Object.keys(src).filter(function(k){ return k < key && src[k].weight != null; }).sort();
    return keys.length ? {k:keys[keys.length-1], w:src[keys[keys.length-1]].weight} : null;
  }
  function metsOf(name){
    for (var i = 0; i < EXERCISES.length; i++){ if (EXERCISES[i].n === name) return EXERCISES[i].m; }
    for (var j = 0; j < EXERCISES.length; j++){ if (name && name.indexOf(EXERCISES[j].n) >= 0) return EXERCISES[j].m; }
    return DEFAULT_MET;
  }
  function estimateBurn(name, min){
    min = +min || 0;
    return Math.round(metsOf(name) * calcWeight(state.sel) * (min/60) * 1.05);
  }

  /* ---------------- サンプル表示 ---------------- */
  var DEMO = (function(){
    var out = {}, today = dateKey(new Date());
    out[today] = {date:today, weight:65.4, fat:22.1, items:[
      {id:"d1", slot:"breakfast", name:"食パン 6枚切1枚", kcal:158},
      {id:"d2", slot:"breakfast", name:"卵 1個", kcal:76},
      {id:"d3", slot:"breakfast", name:"コーヒー(ブラック)", kcal:8},
      {id:"d4", slot:"lunch", name:"おにぎり(鮭)", kcal:180},
      {id:"d5", slot:"lunch", name:"豚汁 1杯", kcal:130},
      {id:"d6", slot:"lunch", name:"サラダチキン 1個", kcal:110},
      {id:"d7", slot:"dinner", name:"ご飯 茶碗1杯(150g)", kcal:234},
      {id:"d8", slot:"dinner", name:"鮭の塩焼き 1切れ", kcal:150},
      {id:"d9", slot:"dinner", name:"ほうれん草のおひたし", kcal:25},
      {id:"d10", slot:"dinner", name:"味噌汁 1杯", kcal:40},
      {id:"d11", slot:"snack", name:"ヨーグルト(無糖)", kcal:62},
      {id:"d12", slot:"snack", name:"バナナ 1本", kcal:86}
    ], exercise:[
      {id:"e1", name:"ウォーキング", min:40, kcal:159},
      {id:"e2", name:"筋トレ(自重)", min:20, kcal:80}
    ]};
    var past = [1720,1980,1450,2130,1670,1880];
    var wts  = [65.6,65.7,65.8,66.0,66.1,66.2];
    var lunches = [
      {n:"ラーメン 1杯",k:500},{n:"カレーライス 1皿",k:700},{n:"そば 1人前",k:296},
      {n:"牛丼 並",k:650},{n:"パスタ(乾100g)",k:378},{n:"うどん 1玉",k:242}
    ];
    for (var i = 1; i <= 6; i++){
      var k = shiftKey(today, -i), lu = lunches[i-1];
      out[k] = normDay({date:k, weight:wts[i-1], items:[
        {id:"pb"+i, slot:"breakfast", name:"食パン 6枚切1枚", kcal:158},
        {id:"pl"+i, slot:"lunch", name:lu.n, kcal:lu.k},
        {id:"pd"+i, slot:"dinner", name:"夕食(ご飯・主菜・副菜)", kcal:past[i-1] - 158 - lu.k}
      ]}, k);
    }
    return out;
  })();

  /* ---------------- 保存 ---------------- */
  function saveLocal(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({target:state.target, targetWeight:state.targetWeight, days:state.days})); }catch(e){}
  }
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      return (o && typeof o === "object") ? o : null;
    }catch(e){ return null; }
  }
  function persistDay(key){
    var d = dayOf(key);
    if (state.db){
      state.db.doc("days/" + key).set({date:d.date, items:d.items, exercise:d.exercise, weight:d.weight, fat:d.fat})
        .catch(function(err){ flash("保存できませんでした（" + (err && err.code ? err.code : "error") + "）"); });
    } else { saveLocal(); }
  }
  function persistSettings(){
    if (state.db){
      state.db.doc("settings/main").set({targetKcal:state.target, targetWeight:state.targetWeight})
        .catch(function(){ flash("目標を保存できませんでした"); });
    } else { saveLocal(); }
  }
  var msgTimer = null;
  function flash(t){
    el("msg").textContent = t;
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function(){ el("msg").textContent = ""; }, 4000);
  }

  /* ---------------- 記録の追加・削除 ---------------- */
  function touchDay(key){
    if (!state.days[key]) state.days[key] = normDay(null, key);
    return state.days[key];
  }
  function addItem(slot, name, kcal){
    name = String(name||"").trim(); kcal = Math.round(+kcal);
    if (!name || !isFinite(kcal) || kcal < 0) return;
    var day = touchDay(state.sel);
    day.items = day.items.concat([{id:uid(), slot:slot, name:name, kcal:kcal, at:new Date().toISOString()}]);
    ui.q = ""; ui.kcal = ""; ui.open = slot;
    persistDay(state.sel); render(); focusFirst(slot);
  }
  function addExercise(name, min, kcal){
    name = String(name||"").trim(); min = Math.round(+min); kcal = Math.round(+kcal);
    if (!name) return;
    if (!isFinite(min) || min <= 0) min = 0;
    if (!isFinite(kcal) || kcal < 0) kcal = estimateBurn(name, min);
    var day = touchDay(state.sel);
    day.exercise = day.exercise.concat([{id:uid(), name:name, min:min, kcal:kcal, at:new Date().toISOString()}]);
    ui.exName = ""; ui.exMin = "30"; ui.exKcal = ""; ui.exTouched = false; ui.open = "exercise";
    persistDay(state.sel); render(); focusFirst("exercise");
  }
  function addItems(slot, list){
    var day = touchDay(state.sel), added = 0;
    list.forEach(function(x){
      var name = String(x.name||"").trim(), kcal = Math.round(+x.kcal);
      if (!name || !isFinite(kcal) || kcal < 0) return;
      day.items = day.items.concat([{id:uid(), slot:slot, name:name, kcal:kcal, photo:true, at:new Date().toISOString()}]);
      added++;
    });
    if (!added) return 0;
    persistDay(state.sel); render();
    return added;
  }
  function removeItem(id){
    var day = state.days[state.sel]; if (!day) return;
    day.items = day.items.filter(function(i){ return i.id !== id; });
    persistDay(state.sel); render();
  }
  function removeExercise(id){
    var day = state.days[state.sel]; if (!day) return;
    day.exercise = day.exercise.filter(function(i){ return i.id !== id; });
    persistDay(state.sel); render();
  }
  function setWeight(field, value){
    var day = touchDay(state.sel);
    var v = value === "" ? null : Math.round(+value * 10) / 10;
    if (v !== null && (!isFinite(v) || v <= 0)) return;
    day[field] = v;
    persistDay(state.sel); render();
    if (v !== null) flash(field === "weight" ? "体重を記録しました" : "体脂肪率を記録しました");
  }

  /* ---------------- 候補 ---------------- */
  function frequentFoods(){
    var counts = {}, kcals = {}, from = shiftKey(state.sel, -30);
    for (var k in state.days){
      if (k < from || k > state.sel) continue;
      (state.days[k].items||[]).forEach(function(i){
        counts[i.name] = (counts[i.name]||0)+1; kcals[i.name] = i.kcal;
      });
    }
    return Object.keys(counts).filter(function(n){return counts[n]>=2;})
      .sort(function(a,b){return counts[b]-counts[a];}).slice(0,6)
      .map(function(n){ return {n:n, k:kcals[n], freq:true}; });
  }
  function suggestFor(slot, q){
    q = (q||"").trim();
    if (q) return CATALOG.filter(function(f){ return f.n.indexOf(q)>=0 || f.g.indexOf(q)>=0; }).slice(0,8);
    var conf = SLOTS.filter(function(s){return s.k===slot;})[0], byGroup = [];
    conf.groups.forEach(function(g){
      CATALOG.filter(function(f){return f.g===g;}).slice(0,3).forEach(function(f){ byGroup.push(f); });
    });
    var used = {}, out = [];
    frequentFoods().concat(byGroup).forEach(function(f){ if(!used[f.n]){ used[f.n]=1; out.push(f);} });
    return out.slice(0,8);
  }
  function frequentExercises(){
    var counts = {}, mins = {}, from = shiftKey(state.sel,-30);
    for (var k in state.days){
      if (k < from || k > state.sel) continue;
      (state.days[k].exercise||[]).forEach(function(i){ counts[i.name]=(counts[i.name]||0)+1; mins[i.name]=i.min; });
    }
    return Object.keys(counts).filter(function(n){return counts[n]>=2;})
      .sort(function(a,b){return counts[b]-counts[a];}).slice(0,4)
      .map(function(n){ return {n:n, min:mins[n], freq:true}; });
  }
  function suggestExercise(q){
    q = (q||"").trim();
    var list = q ? EXERCISES.filter(function(e){return e.n.indexOf(q)>=0;}) : EXERCISES;
    var used = {}, out = [];
    frequentExercises().concat(list).forEach(function(e){ if(!used[e.n]){ used[e.n]=1; out.push(e);} });
    return out.slice(0, q ? 8 : 9);
  }

  /* ---------------- 描画 ---------------- */
  function render(){
    var isWeek = ui.view === "week";
    el("viewDay").setAttribute("aria-pressed", String(!isWeek));
    el("viewWeek").setAttribute("aria-pressed", String(isWeek));
    el("weightbar").hidden = isWeek;
    el("facts").hidden = isWeek;
    el("logs").hidden = isWeek;
    el("history").hidden = isWeek;
    el("weekly").hidden = !isWeek;
    el("photoCta").hidden = isWeek || !canPhoto();
    if (isWeek){ renderWeekNav(); renderWeek(); return; }
    renderDay();
  }

  function renderDay(){
    var key = state.sel, todayK = dateKey(new Date()), demo = isDemo();
    var day = viewDay(key);
    var items = day.items, total = totalOf(key), burn = burnOf(key);
    var target = state.target, allowance = target + burn, diff = allowance - total;

    var d = parseKey(key);
    el("dateMain").textContent = (d.getMonth()+1) + "月" + d.getDate() + "日";
    el("dateSub").textContent = WEEK[d.getDay()] + (key === todayK ? "・今日" : "");
    el("nextDay").disabled = key >= todayK;
    el("todayBtn").hidden = key === todayK;
    el("todayBtn").textContent = "今日へ";
    el("demoBanner").hidden = !demo;

    // 体重
    var wIn = el("weightInput"), fIn = el("fatInput");
    if (document.activeElement !== wIn) wIn.value = day.weight != null ? day.weight : "";
    if (document.activeElement !== fIn) fIn.value = day.fat != null ? day.fat : "";
    var near = weightNear(key);
    wIn.placeholder = near != null ? fmt1(near) : "--";
    var lines = [];
    if (day.weight != null){
      var pv = prevWeight(key);
      if (pv){
        var dv = day.weight - pv.w;
        var pd = parseKey(pv.k);
        lines.push('<span>前回(' + (pd.getMonth()+1) + '/' + pd.getDate() + ')から <b class="' + (dv <= 0 ? "down" : "up") + '">' +
          (dv > 0 ? "+" : dv < 0 ? "−" : "±") + fmt1(Math.abs(dv)) + ' kg</b></span>');
      }
      if (state.targetWeight != null){
        var tw = day.weight - state.targetWeight;
        lines.push('<span>目標まで <b class="' + (tw <= 0 ? "down" : "") + '">' +
          (tw <= 0 ? "達成" : "あと " + fmt1(tw) + " kg") + '</b></span>');
      }
    } else {
      lines.push('<span>この日の体重は未記録</span>');
      if (state.targetWeight != null) lines.push('<span>目標 <b>' + fmt1(state.targetWeight) + ' kg</b></span>');
    }
    el("wdelta").innerHTML = lines.join("");

    // 合計
    el("totalKcal").textContent = fmt(total);
    el("itemCount").textContent = items.length + " 品";
    el("targetVal").textContent = fmt(target) + " kcal";
    el("goalBtnVal").textContent = fmt(target) + " kcal";
    el("burnRow").hidden = burn <= 0;
    el("burnVal").textContent = "+" + fmt(burn) + " kcal";
    var rrow = el("remainRow");
    rrow.className = "frow big " + (diff >= 0 ? "under" : "over");
    el("remainLabel").textContent = diff >= 0 ? (burn > 0 ? "残り（運動分を含む）" : "残り") : "超過";
    el("remainVal").textContent = fmt(Math.abs(diff)) + " kcal";
    el("budgetFill").style.width = (allowance > 0 ? Math.min(total/allowance,1)*100 : 0).toFixed(1) + "%";
    el("budget").className = "budget" + (diff < 0 ? " is-over" : "");
    el("breakdown").innerHTML = SLOTS.map(function(s){
      var v = items.filter(function(i){return i.slot===s.k;}).reduce(function(a,i){return a+(+i.kcal||0);},0);
      return '<span>' + SLOT_SHORT[s.k] + ' <b class="num">' + fmt(v) + '</b></span>';
    }).join("") + (burn > 0 ? '<span>運動 <b class="num">−' + fmt(burn) + '</b></span>' : "");

    // 食事＋運動
    var html = SLOTS.map(function(s){ return mealSection(s, items, demo); }).join("");
    html += exerciseSection(day.exercise, demo);
    el("logs").innerHTML = html;

    renderChart();
  }

  function mealSection(s, items, demo){
    var list = items.filter(function(i){return i.slot===s.k;});
    var sub = list.reduce(function(a,i){return a+(+i.kcal||0);},0);
    var rows = list.map(function(i){
      return '<li><span class="nm">' + esc(i.name) + (i.photo ? '<small>📷</small>' : '') + '</span><span class="kc num">' + fmt(i.kcal) + '<em>kcal</em></span>' +
        (demo ? '<span></span>' : '<button class="del" data-del="' + esc(i.id) + '" aria-label="' + esc(i.name) + 'を削除">×</button>') + '</li>';
    }).join("");
    var form = "";
    if (ui.open === s.k){
      form = '<div class="addform">' +
        '<div class="manual">' +
          '<input type="text" data-field="name" data-slot="' + s.k + '" placeholder="食べたもの" value="' + esc(ui.q) + '" autocomplete="off">' +
          '<input type="number" data-field="kcal" data-slot="' + s.k + '" placeholder="kcal" inputmode="numeric" min="0" step="1" value="' + esc(ui.kcal) + '">' +
          '<button data-submit="' + s.k + '">記録</button>' +
        '</div>' +
        '<div class="sug">' + foodChips(s.k) + '</div>' +
        (canPhoto() ? '<button class="photo-mini" data-photo="' + s.k + '">📷 写真から読み取る</button>' : '') +
        '<p class="hint">候補をタップするとそのまま記録できます。名前を入力すると一覧から探します。</p>' +
      '</div>';
    }
    return '<article class="meal' + (demo ? ' is-demo' : '') + '">' +
      '<div class="meal-head"><h2>' + s.ja + '<span class="en">' + s.en + '</span></h2>' +
      '<span class="k num' + (sub ? '' : ' zero') + '">' + fmt(sub) + '<em>kcal</em></span></div>' +
      (list.length ? '<ul class="items">' + rows + '</ul>' : '<p class="empty">まだ記録がありません</p>') +
      '<button class="add-btn" data-open="' + s.k + '">' + (ui.open === s.k ? '＋ ' + s.ja + 'を記録中' : '＋ ' + s.ja + 'を追加') + '</button>' +
      form + '</article>';
  }

  function foodChips(slot){
    return suggestFor(slot, ui.q).map(function(f){
      return '<button class="chip' + (f.freq?' freq':'') + '" data-add="' + esc(f.n) + '" data-kcal="' + f.k + '">' +
        esc(f.n) + '<span class="c num">' + f.k + '</span></button>';
    }).join("");
  }
  function exChips(){
    var min = +ui.exMin || 30;
    return suggestExercise(ui.exName).map(function(e){
      var k = estimateBurn(e.n, e.freq && e.min ? e.min : min);
      return '<button class="chip' + (e.freq?' freq':'') + '" data-ex="' + esc(e.n) + '" data-min="' + (e.freq && e.min ? e.min : min) + '">' +
        esc(e.n) + '<span class="c num">' + k + '</span></button>';
    }).join("");
  }

  function exerciseSection(list, demo){
    var sub = list.reduce(function(a,i){return a+(+i.kcal||0);},0);
    var rows = list.map(function(i){
      return '<li><span class="nm">' + esc(i.name) + (i.min ? '<small>' + i.min + '分</small>' : '') + '</span>' +
        '<span class="kc num">−' + fmt(i.kcal) + '<em>kcal</em></span>' +
        (demo ? '<span></span>' : '<button class="del" data-exdel="' + esc(i.id) + '" aria-label="' + esc(i.name) + 'を削除">×</button>') + '</li>';
    }).join("");
    var form = "";
    if (ui.open === "exercise"){
      var estimate = ui.exTouched ? ui.exKcal : (ui.exName ? estimateBurn(ui.exName, ui.exMin) : "");
      form = '<div class="addform">' +
        '<div class="manual ex"><input type="text" data-field="exname" placeholder="運動の種目" value="' + esc(ui.exName) + '" autocomplete="off"></div>' +
        '<div class="manual2">' +
          '<label class="mini"><span>時間 (分)</span><input type="number" data-field="exmin" placeholder="30" inputmode="numeric" min="1" step="1" value="' + esc(ui.exMin) + '"></label>' +
          '<label class="mini"><span>消費 kcal</span><input type="number" data-field="exkcal" placeholder="自動" inputmode="numeric" min="0" step="1" value="' + esc(estimate) + '"></label>' +
          '<button data-exsubmit="1">記録</button>' +
        '</div>' +
        '<div class="sug">' + exChips() + '</div>' +
        '<p class="hint">消費カロリーは 体重 ' + fmt1(calcWeight(state.sel)) + ' kg で自動計算します（上書きもできます）。' +
          (weightNear(state.sel) == null ? '体重を記録すると精度が上がります。' : '') + '</p>' +
      '</div>';
    }
    return '<article class="meal last' + (demo ? ' is-demo' : '') + '">' +
      '<div class="meal-head"><h2>運動<span class="en">EXERCISE</span></h2>' +
      '<span class="k num' + (sub ? ' burn' : ' zero') + '">' + (sub ? '−' : '') + fmt(sub) + '<em>kcal</em></span></div>' +
      (list.length ? '<ul class="items">' + rows + '</ul>' : '<p class="empty">まだ記録がありません</p>') +
      '<button class="add-btn" data-open="exercise">' + (ui.open === "exercise" ? '＋ 運動を記録中' : '＋ 運動を追加') + '</button>' +
      form + '</article>';
  }

  /* ---------------- グラフ ---------------- */
  function renderChart(){
    el("tabKcal").setAttribute("aria-selected", String(ui.tab === "kcal"));
    el("tabWeight").setAttribute("aria-selected", String(ui.tab === "weight"));
    if (ui.tab === "kcal") chartKcal(); else chartWeight();
  }

  function chartKcal(){
    el("chartTitle").textContent = "この日までの7日間";
    el("chartNote").textContent = "破線は目標カロリー。棒はその日に食べた合計です。";
    var W = 360, H = 138, padL = 8, padR = 8, top = 20, base = 100;
    var keys = [];
    for (var i = 6; i >= 0; i--) keys.push(shiftKey(state.sel, -i));
    var totals = keys.map(totalOf);
    var rec = totals.filter(function(t){return t>0;});
    var avg = rec.length ? rec.reduce(function(a,b){return a+b;},0)/rec.length : 0;
    el("avgVal").innerHTML = (rec.length ? '<span class="num">' + fmt(avg) + '</span>' : "—") + ' <em>平均 kcal / 記録' + rec.length + '日</em>';

    var scale = Math.max.apply(null, totals.concat([state.target,1])) * 1.2;
    var step = (W-padL-padR)/7, bw = Math.min(30, step-12), h = base-top, parts = [];
    var ty = base - (state.target/scale)*h;
    parts.push('<line x1="'+padL+'" y1="'+ty.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ty.toFixed(1)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" />');
    parts.push('<text x="'+(W-padR)+'" y="'+(ty-5).toFixed(1)+'" text-anchor="end" font-size="9" font-weight="700" fill="var(--muted)">目標 '+fmt(state.target)+'</text>');
    keys.forEach(function(k,i){
      var t = totals[i], bh = (t/scale)*h, x = padL + step*i + (step-bw)/2, y = base-bh;
      var isSel = k === state.sel, over = t > state.target + burnOf(k);
      if (t > 0){
        parts.push('<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,1).toFixed(1)+'" rx="1.5" fill="'+(over?"var(--warn)":"var(--accent)")+'" fill-opacity="'+(isSel?"1":"0.42")+'" />');
        parts.push('<text x="'+(x+bw/2).toFixed(1)+'" y="'+Math.max(y-5,10).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)" fill-opacity="'+(isSel?"1":"0.55")+'">'+fmt(t)+'</text>');
      } else {
        parts.push('<rect x="'+x.toFixed(1)+'" y="'+(base-2)+'" width="'+bw.toFixed(1)+'" height="2" fill="var(--hair)" />');
      }
      var dd = parseKey(k);
      parts.push('<text x="'+(x+bw/2).toFixed(1)+'" y="'+(base+15)+'" text-anchor="middle" font-size="9.5" font-weight="'+(isSel?"700":"500")+'" fill="'+(isSel?"var(--ink)":"var(--muted)")+'">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</text>');
      parts.push('<text x="'+(x+bw/2).toFixed(1)+'" y="'+(base+27)+'" text-anchor="middle" font-size="8.5" fill="var(--muted)">'+WEEK_S[dd.getDay()]+'</text>');
    });
    parts.push('<line x1="'+padL+'" y1="'+base+'" x2="'+(W-padR)+'" y2="'+base+'" stroke="var(--hair)" stroke-width="1" />');
    el("chart").innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="直近7日間の合計カロリー">'+parts.join("")+'</svg>';
  }

  function chartWeight(){
    el("chartTitle").textContent = "この日までの30日間";
    var W = 360, H = 138, padL = 30, padR = 12, top = 16, base = 100;
    var src = isDemo() ? DEMO : state.days;
    var keys = [];
    for (var i = 29; i >= 0; i--) keys.push(shiftKey(state.sel, -i));
    var pts = [];
    keys.forEach(function(k,i){
      var d = src[k];
      if (d && d.weight != null) pts.push({i:i, k:k, w:d.weight});
    });

    if (!pts.length){
      el("avgVal").innerHTML = '— <em>体重の記録なし</em>';
      el("chartNote").textContent = "上の「体重」に数値を入れると、ここに推移が出ます。";
      el("chart").innerHTML = '<svg viewBox="0 0 '+W+' 92" role="img" aria-label="体重の推移"><text x="'+(W/2)+'" y="50" text-anchor="middle" font-size="12" fill="var(--muted)">この30日間の体重の記録がありません</text></svg>';
      return;
    }

    var last = pts[pts.length-1], first = pts[0];
    var fw = firstWeight();
    var chg = last.w - first.w;
    var head = '<span class="num">' + fmt1(last.w) + '</span> <em>kg（' + (chg>0?"+":chg<0?"−":"±") + fmt1(Math.abs(chg)) + ' kg / 30日）</em>';
    el("avgVal").innerHTML = head;
    var noteBits = [];
    if (fw) noteBits.push("開始 " + fmt1(fw.w) + " kg から " + ((last.w-fw.w)>0?"+":(last.w-fw.w)<0?"−":"±") + fmt1(Math.abs(last.w-fw.w)) + " kg");
    if (state.targetWeight != null) noteBits.push(last.w <= state.targetWeight ? "目標達成" : "目標まであと " + fmt1(last.w - state.targetWeight) + " kg");
    el("chartNote").textContent = noteBits.join(" ・ ") || "点は体重を記録した日です。";

    var vals = pts.map(function(p){return p.w;});
    if (state.targetWeight != null) vals = vals.concat([state.targetWeight]);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (hi - lo < 1){ var mid = (hi+lo)/2; lo = mid-0.6; hi = mid+0.6; }
    var padV = (hi-lo)*0.18; lo -= padV; hi += padV;
    var X = function(i){ return padL + (W-padL-padR) * (i/29); };
    var Y = function(w){ return base - ((w-lo)/(hi-lo)) * (base-top); };
    var parts = [];

    // 目盛り
    [hi, (hi+lo)/2, lo].forEach(function(v){
      var y = Y(v);
      parts.push('<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--hair)" stroke-width="1" />');
      parts.push('<text x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="var(--muted)">'+fmt1(v)+'</text>');
    });
    if (state.targetWeight != null && state.targetWeight >= lo && state.targetWeight <= hi){
      var tyy = Y(state.targetWeight);
      parts.push('<line x1="'+padL+'" y1="'+tyy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+tyy.toFixed(1)+'" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" />');
      parts.push('<text x="'+(W-padR)+'" y="'+(tyy-4).toFixed(1)+'" text-anchor="end" font-size="8.5" font-weight="700" fill="var(--accent)">目標 '+fmt1(state.targetWeight)+'</text>');
    }
    // 折れ線
    var dstr = pts.map(function(p,idx){ return (idx?"L":"M") + X(p.i).toFixed(1) + " " + Y(p.w).toFixed(1); }).join(" ");
    parts.push('<path d="'+dstr+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />');
    pts.forEach(function(p,idx){
      var isLast = idx === pts.length-1;
      parts.push('<circle cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="'+(isLast?3.4:2)+'" fill="var(--accent)" />');
    });
    parts.push('<text x="'+X(last.i).toFixed(1)+'" y="'+Math.max(Y(last.w)-8,10).toFixed(1)+'" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink)">'+fmt1(last.w)+'</text>');
    // 日付ラベル
    [0,15,29].forEach(function(i){
      var dd = parseKey(keys[i]);
      parts.push('<text x="'+X(i).toFixed(1)+'" y="'+(base+15)+'" text-anchor="'+(i===0?"start":i===29?"end":"middle")+'" font-size="9" fill="var(--muted)">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</text>');
    });
    parts.push('<line x1="'+padL+'" y1="'+base+'" x2="'+(W-padR)+'" y2="'+base+'" stroke="var(--hair)" stroke-width="1" />');
    el("chart").innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="体重の推移">'+parts.join("")+'</svg>';
  }

  /* ---------------- 週まとめ ---------------- */
  function renderWeekNav(){
    var st = weekStart(state.sel), keys = weekKeys(st), todayK = dateKey(new Date());
    var a = parseKey(keys[0]), b = parseKey(keys[6]);
    el("dateMain").textContent = (a.getMonth()+1) + "/" + a.getDate() + " 〜 " + (b.getMonth()+1) + "/" + b.getDate();
    el("dateSub").textContent = (st === weekStart(todayK)) ? "今週" : "";
    el("nextDay").disabled = keys[0] > todayK;
    el("todayBtn").hidden = st === weekStart(todayK);
    el("todayBtn").textContent = "今週へ";
  }

  function weekStats(startKey){
    var keys = weekKeys(startKey), todayK = dateKey(new Date());
    var rows = keys.map(function(k){
      var d = viewDay(k);
      return {
        key:k, date:parseKey(k), future:k > todayK,
        intake:totalOf(k), burn:burnOf(k), weight:d.weight,
        snack:d.items.filter(function(i){return i.slot==="snack";}).reduce(function(a,i){return a+(+i.kcal||0);},0),
        exMin:d.exercise.reduce(function(a,i){return a+(+i.min||0);},0),
        items:d.items
      };
    });
    var rec = rows.filter(function(r){ return r.intake > 0; });
    var st = {
      rows:rows, recDays:rec.length,
      intake: rec.reduce(function(a,r){return a+r.intake;},0),
      avg: rec.length ? rec.reduce(function(a,r){return a+r.intake;},0)/rec.length : 0,
      burn: rows.reduce(function(a,r){return a+r.burn;},0),
      exDays: rows.filter(function(r){return r.burn>0;}).length,
      exMin: rows.reduce(function(a,r){return a+r.exMin;},0),
      snack: rows.reduce(function(a,r){return a+r.snack;},0),
      under: rec.filter(function(r){ return r.intake <= state.target + r.burn; }).length,
      max: null, wFirst:null, wLast:null
    };
    rec.forEach(function(r){ if (!st.max || r.intake > st.max.intake) st.max = r; });
    rows.forEach(function(r){
      if (r.weight == null) return;
      if (!st.wFirst) st.wFirst = r;
      st.wLast = r;
    });
    return st;
  }

  function topFoods(startKey){
    var map = {};
    weekKeys(startKey).forEach(function(k){
      viewDay(k).items.forEach(function(i){
        var e = map[i.name] || (map[i.name] = {n:i.name, c:0, k:0});
        e.c++; e.k += (+i.kcal || 0);
      });
    });
    return Object.keys(map).map(function(n){return map[n];})
      .sort(function(a,b){ return b.c - a.c || b.k - a.k; }).slice(0,5);
  }

  function weekNotes(st, prev){
    var out = [];
    var diff = st.avg - state.target;
    out.push("1日あたり平均 <b>" + fmt(st.avg) + " kcal</b>。目標 " + fmt(state.target) + " kcal に対して <b>" +
      (diff >= 0 ? "+" : "−") + fmt(Math.abs(diff)) + " kcal</b> でした。");
    if (st.recDays > 0){
      out.push("目標内におさまった日は <b>" + st.under + "/" + st.recDays + " 日</b>。" +
        (st.max ? "いちばん多かったのは " + (st.max.date.getMonth()+1) + "/" + st.max.date.getDate() +
          "(" + WEEK_S[st.max.date.getDay()] + ") の <b>" + fmt(st.max.intake) + " kcal</b>。" : ""));
    }
    if (st.snack > 0){
      out.push("間食の合計は <b>" + fmt(st.snack) + " kcal</b>（記録した日の平均 " + fmt(st.snack/Math.max(st.recDays,1)) + " kcal）。");
    }
    out.push(st.exDays > 0
      ? "運動したのは <b>" + st.exDays + "日</b>、合計 " + st.exMin + "分で <b>" + fmt(st.burn) + " kcal</b> 消費しました。"
      : "この週は運動の記録がありませんでした。10分の早歩きでも記録すると流れがつかめます。");
    if (st.wFirst && st.wLast && st.wFirst.key !== st.wLast.key){
      var dw = st.wLast.weight - st.wFirst.weight;
      out.push("体重は <b>" + fmt1(st.wFirst.weight) + " → " + fmt1(st.wLast.weight) + " kg</b>（" +
        (dw > 0 ? "+" : dw < 0 ? "−" : "±") + fmt1(Math.abs(dw)) + " kg）。");
      if (state.targetWeight != null && dw < -0.05){
        var remain = st.wLast.weight - state.targetWeight;
        if (remain > 0){
          var wks = Math.ceil(remain / Math.abs(dw));
          out.push(wks <= 78
            ? "このペースが続けば、目標の " + fmt1(state.targetWeight) + " kg まで <b>あと約 " + wks + "週間</b>です。"
            : "目標まではもう少し時間がかかりそうです。まずは1か月続けるところから。");
        } else {
          out.push("目標体重に到達しています。ここからは維持を目安に。");
        }
      }
    } else if (st.wLast){
      out.push("体重の記録はこの週 1日分でした（" + fmt1(st.wLast.weight) + " kg）。週2〜3回でも記録すると変化が見えます。");
    }
    if (prev && prev.recDays > 0 && st.recDays > 0){
      var d2 = st.avg - prev.avg;
      out.push("先週の平均 " + fmt(prev.avg) + " kcal より <b>" + (d2 >= 0 ? "+" : "−") + fmt(Math.abs(d2)) + " kcal</b>。");
    }
    return out;
  }

  function renderWeek(){
    var st0 = weekStart(state.sel), todayK = dateKey(new Date());
    var st = weekStats(st0);
    var prev = weekStats(shiftKey(st0, -7));

    if (st.recDays === 0 && !st.wLast && st.burn === 0){
      el("weekly").innerHTML = '<p class="wk-empty">この週の記録はまだありません。<br>「日ごと」に切り替えて記録すると、ここにまとめが出ます。</p>';
      return;
    }

    // タイル
    var dAvg = st.avg - state.target;
    var wTile, wSub;
    if (st.wFirst && st.wLast && st.wFirst.key !== st.wLast.key){
      var dw = st.wLast.weight - st.wFirst.weight;
      wTile = '<span class="n ' + (dw <= 0 ? "good" : "bad") + '">' + (dw > 0 ? "+" : dw < 0 ? "−" : "±") + fmt1(Math.abs(dw)) + '<em>kg</em></span>';
      wSub = fmt1(st.wFirst.weight) + " → " + fmt1(st.wLast.weight) + " kg";
    } else if (st.wLast){
      wTile = '<span class="n">' + fmt1(st.wLast.weight) + '<em>kg</em></span>';
      wSub = "記録は1日分";
    } else {
      wTile = '<span class="n" style="color:var(--muted)">—</span>';
      wSub = "体重の記録なし";
    }
    var tiles =
      '<div class="wk-tile"><span class="eyebrow">1日平均</span>' +
        '<span class="n">' + fmt(st.avg) + '<em>kcal</em></span>' +
        '<span class="s">目標より ' + (dAvg >= 0 ? "+" : "−") + fmt(Math.abs(dAvg)) + ' kcal</span></div>' +
      '<div class="wk-tile"><span class="eyebrow">体重の変化</span>' + wTile + '<span class="s">' + wSub + '</span></div>' +
      '<div class="wk-tile"><span class="eyebrow">運動</span>' +
        '<span class="n ' + (st.burn > 0 ? "good" : "") + '">' + (st.burn > 0 ? "−" : "") + fmt(st.burn) + '<em>kcal</em></span>' +
        '<span class="s">' + st.exDays + '日 / 合計 ' + st.exMin + '分</span></div>' +
      '<div class="wk-tile"><span class="eyebrow">記録できた日</span>' +
        '<span class="n">' + st.recDays + '<em>/ 7日</em></span>' +
        '<span class="s">目標内 ' + st.under + '日</span></div>';

    // 日別テーブル
    var maxIntake = Math.max.apply(null, st.rows.map(function(r){return r.intake;}).concat([state.target, 1]));
    var body = st.rows.map(function(r){
      var cls = [];
      if (r.key === todayK) cls.push("today");
      if (!r.intake && r.weight == null && !r.burn) cls.push("blank");
      var net = r.intake ? r.intake - r.burn - state.target : null;
      var pct = Math.min(r.intake / maxIntake, 1) * 100;
      var over = r.intake > state.target + r.burn;
      return '<tr class="' + cls.join(" ") + '">' +
        '<td>' + (r.date.getMonth()+1) + '/' + r.date.getDate() + '<small>' + WEEK_S[r.date.getDay()] + '</small></td>' +
        '<td class="bar">' + (r.intake ? '<i class="' + (over ? "over" : "") + '" style="width:' + pct.toFixed(0) + '%"></i><b>' + fmt(r.intake) + '</b>' : '<span style="color:var(--muted)">—</span>') + '</td>' +
        '<td>' + (r.burn ? '−' + fmt(r.burn) : '<span style="color:var(--muted)">—</span>') + '</td>' +
        '<td>' + (net === null ? '<span style="color:var(--muted)">—</span>' :
          '<span class="' + (net > 0 ? "pos" : "neg") + '">' + (net > 0 ? "+" : "−") + fmt(Math.abs(net)) + '</span>') + '</td>' +
        '<td>' + (r.weight != null ? fmt1(r.weight) : '<span style="color:var(--muted)">—</span>') + '</td>' +
      '</tr>';
    }).join("");
    var table =
      '<div class="wk-block"><h3>日ごとの記録<span>差引 = 摂取 − 運動 − 目標</span></h3>' +
      '<div class="wk-scroll"><table class="wk-table">' +
        '<thead><tr><th>日付</th><th>摂取</th><th>運動</th><th>差引</th><th>体重</th></tr></thead>' +
        '<tbody>' + body + '</tbody></table></div></div>';

    // よく食べたもの
    var foods = topFoods(st0);
    var rank = foods.length
      ? '<div class="wk-block"><h3>よく食べたもの<span>この週の合計</span></h3><ul class="wk-rank">' +
          foods.map(function(f,i){
            return '<li><span class="r">' + (i+1) + '</span><span>' + esc(f.n) + '</span>' +
              '<span class="c">' + f.c + '回</span><span class="k num">' + fmt(f.k) + '<em>kcal</em></span></li>';
          }).join("") + '</ul></div>'
      : "";

    // 気づき
    var notes = '<div class="wk-block"><h3>ふりかえり</h3><ul class="wk-notes">' +
      weekNotes(st, prev).map(function(t){ return '<li><span>' + t + '</span></li>'; }).join("") + '</ul></div>';

    el("weekly").innerHTML = '<div class="wk-tiles">' + tiles + '</div>' + table + rank + notes;
  }

  /* ---------------- 写真から記録 ---------------- */
  function canPhoto(){ return !!(state.sample && state.imgLimits); }

  function slotByHour(){
    var h = new Date().getHours();
    return h < 11 ? "breakfast" : h < 15 ? "lunch" : h < 21 ? "dinner" : "snack";
  }
  function slotJa(k){
    for (var i=0;i<SLOTS.length;i++){ if (SLOTS[i].k === k) return SLOTS[i].ja; }
    return "食事";
  }

  var PROMPT = [
    "これは食事の写真です。写っている料理・食品を1品ずつ挙げ、それぞれの推定カロリー(kcal)を答えてください。",
    "・日本の一般的な1人前を基準にし、写真から量が読み取れる場合はその量を反映してください。",
    "・飲みものも含めてください。食器・カトラリー・テーブル・背景は無視してください。",
    "・品名は日本語で、分量が分かるように短く書いてください（例:「ご飯 茶碗1杯」「唐揚げ 3個」）。",
    "・自信の度合いを confidence に high / medium / low で入れてください。",
    "・食べもの・飲みものが写っていない場合は items を空の配列にしてください。",
    "JSONだけで回答してください。形式:",
    '{"items":[{"name":"ご飯 茶碗1杯","kcal":234,"confidence":"high"}],"note":"写真全体の短い説明"}'
  ].join("\n");

  var ERR_MSG = {
    not_granted:"写真の読み取りには、このページからClaudeに聞く許可が必要です。もう一度試して「許可」を選んでください。",
    rate_limited:"読み取りの回数制限に達しました。少し時間をおいてからもう一度お試しください。",
    images_unavailable:"この環境では写真を送れません。手で入力してください。",
    image_rejected:"この画像は読み取れませんでした。別の写真でお試しください。",
    invalid_json:"うまく読み取れませんでした。もう一度撮るか、手で入力してください。",
    empty_completion:"うまく読み取れませんでした。もう一度お試しください。",
    refused:"この写真からは料理を読み取れませんでした。手で入力してください。",
    prompt_too_large:"画像が大きすぎました。別の写真でお試しください。",
    session_expired:"接続が切れました。ページを開き直してください。",
    sampling_disabled:"写真の読み取りが利用できない状態です。手で入力してください。",
    upstream_error:"読み取りに失敗しました。少し時間をおいてお試しください。"
  };

  function openPhoto(slot){
    photo.slot = slot || slotByHour();
    el("photoInput").value = "";
    el("photoInput").click();
  }

  function shrink(file, cb){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight;
      var r = Math.min(1, max / Math.max(w, h));
      if (r === 1 && file.size < 3 * 1024 * 1024){ URL.revokeObjectURL(url); cb(file); return; }
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w * r));
      c.height = Math.max(1, Math.round(h * r));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(b){ URL.revokeObjectURL(url); cb(b || file); }, "image/jpeg", 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); cb(file); };
    img.src = url;
  }

  function startPhoto(file){
    if (!file) return;
    if (state.imgLimits && state.imgLimits.maxInputBytes && file.size > state.imgLimits.maxInputBytes * 4){
      photo.status = "error"; photo.err = "画像が大きすぎます。別の写真でお試しください。";
      photo.open = true; renderSheet(); return;
    }
    shrink(file, function(blob){
      if (photo.url) URL.revokeObjectURL(photo.url);
      photo.blob = blob;
      photo.url = URL.createObjectURL(blob);
      photo.items = []; photo.err = "";
      photo.status = "reading";
      photo.open = true;
      renderSheet();
      analyze();
    });
  }

  function analyze(){
    photo.ctl = new AbortController();
    state.sample.json(PROMPT, {images:[photo.blob], modelTier:"default", signal:photo.ctl.signal})
      .then(function(res){
        var list = (res && Array.isArray(res.items)) ? res.items : [];
        photo.items = list.map(function(x){
          return {
            name: String((x && x.name) || "").slice(0, 60),
            kcal: Math.max(0, Math.round(+(x && x.kcal) || 0)),
            low: (x && String(x.confidence || "").toLowerCase() === "low"),
            on: true
          };
        }).filter(function(x){ return x.name; });
        photo.status = photo.items.length ? "done" : "empty";
        renderSheet();
      })
      .catch(function(e){
        var code = e && e.code;
        if (code === "cancelled"){ closeSheet(); return; }
        photo.status = "error";
        photo.err = ERR_MSG[code] || "読み取りに失敗しました。もう一度お試しください。";
        renderSheet();
      });
  }

  function closeSheet(){
    if (photo.ctl){ try{ photo.ctl.abort(); }catch(e){} photo.ctl = null; }
    if (photo.url){ URL.revokeObjectURL(photo.url); photo.url = null; }
    photo.open = false; photo.status = "idle"; photo.items = []; photo.blob = null;
    renderSheet();
  }

  function photoTotal(){
    return photo.items.reduce(function(a,x){ return a + (x.on ? (+x.kcal || 0) : 0); }, 0);
  }
  function photoCount(){
    return photo.items.filter(function(x){ return x.on; }).length;
  }

  function renderSheet(){
    var sheet = el("sheet");
    sheet.hidden = !photo.open;
    if (!photo.open){ el("sheetBody").innerHTML = ""; return; }

    var img = photo.url ? '<img class="shot" src="' + photo.url + '" alt="撮影した食事の写真">' : "";
    var body = "";

    if (photo.status === "reading"){
      el("sheetTitle").textContent = "写真を読み取っています";
      body = img +
        '<div class="reading"><b>料理とカロリーを読み取り中…</b>' +
        '<small>10〜30秒ほどかかります</small><div class="bar"><i></i></div></div>' +
        '<div class="sheet-actions"><button class="ghost" data-sheet="cancel">中止する</button></div>';
    } else if (photo.status === "error" || photo.status === "empty"){
      el("sheetTitle").textContent = "読み取れませんでした";
      body = img +
        '<p class="sheet-err">' + esc(photo.status === "empty" ? "この写真からは料理を見つけられませんでした。" : photo.err) + '</p>' +
        '<div class="sheet-actions">' +
          '<button class="ghost" data-sheet="close">閉じる</button>' +
          '<button class="go" data-sheet="retry">もう一度読み取る</button>' +
        '</div>';
    } else {
      el("sheetTitle").textContent = "読み取り結果を確認";
      var rows = photo.items.map(function(x, i){
        return '<li class="' + (x.on ? "" : "off") + (x.low ? " lowc" : "") + '">' +
          '<input type="checkbox" data-on="' + i + '"' + (x.on ? " checked" : "") + ' aria-label="この品を記録する">' +
          '<input type="text" data-name="' + i + '" value="' + esc(x.name) + '">' +
          '<input type="number" data-kcal="' + i + '" inputmode="numeric" min="0" step="1" value="' + x.kcal + '">' +
          '<button class="del" data-drop="' + i + '" aria-label="この行を消す">×</button>' +
        '</li>';
      }).join("");
      var picks = SLOTS.map(function(sl){
        return '<button data-slot="' + sl.k + '" aria-pressed="' + (photo.slot === sl.k) + '">' + sl.ja + '</button>';
      }).join("");
      var anyLow = photo.items.some(function(x){ return x.low; });
      body = img +
        '<div class="slotpick">' + picks + '</div>' +
        '<ul class="detected">' + rows + '</ul>' +
        '<div class="sheet-total"><span>記録する合計</span><b class="num" id="photoTotal">' + fmt(photoTotal()) + ' kcal</b></div>' +
        '<p class="sheet-note">カロリーは写真からの<b>推定値</b>です。違っていたらその場で直せます。' +
          (anyLow ? 'オレンジ色の行は読み取りの自信が低いので、とくに確認してください。' : '') + '</p>' +
        '<div class="sheet-actions">' +
          '<button class="ghost" data-sheet="close">やめる</button>' +
          '<button class="go" data-sheet="save"' + (photoCount() ? "" : " disabled") + '>' + photoCount() + '品を' + slotJa(photo.slot) + 'に記録</button>' +
        '</div>';
    }
    el("sheetBody").innerHTML = body;
  }

  el("photoCta").addEventListener("click", function(){ openPhoto(slotByHour()); });
  el("sheetClose").addEventListener("click", closeSheet);
  el("sheet").addEventListener("click", function(e){ if (e.target === this) closeSheet(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && photo.open) closeSheet(); });

  el("photoInput").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if (f) startPhoto(f);
  });

  el("sheetBody").addEventListener("click", function(e){
    var t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.slot){ photo.slot = t.dataset.slot; renderSheet(); return; }
    if (t.dataset.drop != null){ photo.items.splice(+t.dataset.drop, 1); renderSheet(); return; }
    var a = t.dataset.sheet;
    if (a === "close" || a === "cancel"){ closeSheet(); return; }
    if (a === "retry"){ photo.status = "reading"; photo.err = ""; renderSheet(); analyze(); return; }
    if (a === "save"){
      var picked = photo.items.filter(function(x){ return x.on; });
      var slot = photo.slot;
      var n = addItems(slot, picked);
      closeSheet();
      if (n) flash(n + "品を" + slotJa(slot) + "に記録しました");
      return;
    }
  });

  el("sheetBody").addEventListener("input", function(e){
    var d = e.target.dataset;
    if (!d) return;
    if (d.name != null && e.target.type === "text"){ photo.items[+d.name].name = e.target.value; }
    else if (d.kcal != null){
      photo.items[+d.kcal].kcal = Math.max(0, Math.round(+e.target.value) || 0);
      var tot = el("photoTotal"); if (tot) tot.textContent = fmt(photoTotal()) + " kcal";
    }
  });
  el("sheetBody").addEventListener("change", function(e){
    var d = e.target.dataset;
    if (d && d.on != null){ photo.items[+d.on].on = e.target.checked; renderSheet(); }
  });

  function focusFirst(slot){
    var sel = slot === "exercise" ? 'input[data-field="exname"]' : 'input[data-field="name"][data-slot="'+slot+'"]';
    var input = document.querySelector(sel);
    if (input) input.focus();
  }

  /* ---------------- イベント ---------------- */
  function step(n){
    state.sel = shiftKey(state.sel, ui.view === "week" ? n*7 : n);
    ui.open = null; render();
  }
  el("prevDay").addEventListener("click", function(){ step(-1); });
  el("nextDay").addEventListener("click", function(){ step(1); });
  el("todayBtn").addEventListener("click", function(){ state.sel = dateKey(new Date()); ui.open = null; render(); });
  el("viewDay").addEventListener("click", function(){
    ui.view = "day"; ui.open = null;
    el("todayBtn").textContent = "今日へ";
    render();
  });
  el("viewWeek").addEventListener("click", function(){ ui.view = "week"; ui.open = null; render(); });
  el("tabKcal").addEventListener("click", function(){ ui.tab = "kcal"; renderChart(); });
  el("tabWeight").addEventListener("click", function(){ ui.tab = "weight"; renderChart(); });

  el("goalBtn").addEventListener("click", function(){
    var s = el("settings");
    s.hidden = !s.hidden;
    this.setAttribute("aria-expanded", String(!s.hidden));
    if (!s.hidden){
      el("targetInput").value = state.target;
      el("targetWeightInput").value = state.targetWeight != null ? state.targetWeight : "";
      el("metNote").textContent = "消費カロリーの計算体重：" + fmt1(calcWeight(state.sel)) + " kg";
      el("targetInput").focus();
    }
  });
  el("targetSave").addEventListener("click", function(){
    var v = Math.round(+el("targetInput").value);
    if (!isFinite(v) || v < 500 || v > 6000){ flash("目標カロリーは500〜6000で入力してください"); return; }
    var wRaw = el("targetWeightInput").value;
    var tw = wRaw === "" ? null : Math.round(+wRaw*10)/10;
    if (tw !== null && (!isFinite(tw) || tw < 20 || tw > 300)){ flash("目標体重は20〜300kgで入力してください"); return; }
    state.target = v; state.targetWeight = tw;
    persistSettings();
    el("settings").hidden = true;
    el("goalBtn").setAttribute("aria-expanded","false");

  });
  ["targetInput","targetWeightInput"].forEach(function(id){
    el(id).addEventListener("keydown", function(e){ if (e.key === "Enter") el("targetSave").click(); });
  });

  el("weightInput").addEventListener("change", function(){ setWeight("weight", this.value.trim()); });
  el("fatInput").addEventListener("change", function(){ setWeight("fat", this.value.trim()); });

  el("logs").addEventListener("click", function(e){
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.open){
      ui.open = (ui.open === t.dataset.open) ? null : t.dataset.open;
      ui.q = ""; ui.kcal = ""; ui.exName = ""; ui.exKcal = ""; ui.exTouched = false;
      render();
      if (ui.open) focusFirst(ui.open);
      return;
    }
    if (t.dataset.photo){ openPhoto(t.dataset.photo); return; }
    if (t.dataset.add){ addItem(ui.open, t.dataset.add, t.dataset.kcal); return; }
    if (t.dataset.submit){ addItem(t.dataset.submit, ui.q, ui.kcal); return; }
    if (t.dataset.ex){
      ui.exName = t.dataset.ex;
      ui.exMin = t.dataset.min || ui.exMin || "30";
      ui.exTouched = false;
      render();
      var m = document.querySelector('input[data-field="exmin"]');
      if (m){ m.focus(); m.select(); }
      return;
    }
    if (t.dataset.exsubmit){
      addExercise(ui.exName, ui.exMin, ui.exTouched ? ui.exKcal : estimateBurn(ui.exName, ui.exMin));
      return;
    }
    if (t.dataset.del){ removeItem(t.dataset.del); return; }
    if (t.dataset.exdel){ removeExercise(t.dataset.exdel); return; }
  });

  el("logs").addEventListener("input", function(e){
    var f = e.target.dataset ? e.target.dataset.field : null;
    if (!f) return;
    if (f === "name"){
      ui.q = e.target.value;
      e.target.closest(".addform").querySelector(".sug").innerHTML = foodChips(e.target.dataset.slot);
    } else if (f === "kcal"){
      ui.kcal = e.target.value;
    } else if (f === "exname" || f === "exmin"){
      if (f === "exname") ui.exName = e.target.value; else ui.exMin = e.target.value;
      var form = e.target.closest(".addform");
      form.querySelector(".sug").innerHTML = exChips();
      if (!ui.exTouched){
        var kf = form.querySelector('input[data-field="exkcal"]');
        kf.value = ui.exName ? estimateBurn(ui.exName, ui.exMin) : "";
      }
    } else if (f === "exkcal"){
      ui.exTouched = true; ui.exKcal = e.target.value;
    }
  });

  el("logs").addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;
    var f = e.target.dataset ? e.target.dataset.field : null;
    if (f === "name"){ e.preventDefault(); e.target.closest(".addform").querySelector('input[data-field="kcal"]').focus(); }
    else if (f === "kcal"){ e.preventDefault(); addItem(e.target.dataset.slot, ui.q, ui.kcal); }
    else if (f === "exname"){ e.preventDefault(); e.target.closest(".addform").querySelector('input[data-field="exmin"]').focus(); }
    else if (f === "exmin" || f === "exkcal"){
      e.preventDefault();
      addExercise(ui.exName, ui.exMin, ui.exTouched ? ui.exKcal : estimateBurn(ui.exName, ui.exMin));
    }
  });

  /* ---------------- 起動 ---------------- */
  function setStorage(mode){
    state.mode = mode;
    var s = el("storageState"), n = el("storageNote");
    if (mode === "cloud"){
      s.innerHTML = '<span class="dot"></span>クラウドに保存中';
      n.textContent = "記録はこのページに保存され、別の端末で開いても同じ内容が表示されます。";
    } else {
      s.innerHTML = '<span class="dot" style="background:var(--muted)"></span>このブラウザに保存中';
      n.textContent = "このページの保存機能が使えないため、記録はこの端末のブラウザにだけ保存されます。";
    }
  }

  var local = loadLocal();
  if (local){
    if (local.target) state.target = local.target;
    if (typeof local.targetWeight === "number") state.targetWeight = local.targetWeight;
    if (local.days){
      Object.keys(local.days).forEach(function(k){ state.days[k] = normDay(local.days[k], k); });
    }
  }
  setStorage("local");
  render();

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("sample").then(function(sample){
      if (!sample || typeof sample.limits !== "function") return;
      return sample.limits().then(function(lim){
        if (lim && lim.images){ state.sample = sample; state.imgLimits = lim.images; render(); }
      });
    }).catch(function(){});

    el("storageState").innerHTML = '<span class="dot" style="background:var(--muted)"></span>保存先を確認中…';
    window.claude.use("db").then(function(db){
      if (!db){ setStorage("local"); render(); return; }
      state.db = db;
      setStorage("cloud");

      db.doc("settings/main").onSnapshot(function(snap){
        if (snap.exists){
          var v = snap.data() || {};
          if (typeof v.targetKcal === "number") state.target = v.targetKcal;
          state.targetWeight = typeof v.targetWeight === "number" ? v.targetWeight : null;
        } else if (local && (local.target || local.targetWeight != null)){
          db.doc("settings/main").set({targetKcal:state.target, targetWeight:state.targetWeight}).catch(function(){});
        }
        render();
      }, function(){});

      db.collection("days").orderBy("date","desc").limit(120).onSnapshot(function(snap){
        var next = {};
        snap.docs.forEach(function(doc){ next[doc.id] = normDay(doc.data(), doc.id); });
        state.days = next;

        // 端末に残っていた記録をクラウドへ引き上げる（消さない・上書きしない）
        if (!state.migrated){
          state.migrated = true;
          if (local && local.days){
            Object.keys(local.days).forEach(function(k){
              var d = normDay(local.days[k], k);
              if (!d.items.length && !d.exercise.length && d.weight == null) return;
              var cur = next[k];
              if (cur && (cur.items.length || cur.exercise.length || cur.weight != null)) return;
              state.days[k] = d;
              db.doc("days/"+k).set({date:k, items:d.items, exercise:d.exercise, weight:d.weight, fat:d.fat}).catch(function(){});
            });
          }
        }
        render();
      }, function(e){
        flash("読み込みに問題が起きました（" + (e && e.code ? e.code : "error") + "）");
      });
    }).catch(function(){ setStorage("local"); render(); });
  }
})();
</script>
