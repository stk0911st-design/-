<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --line: #e3e6ea; --text: #1d2126;
    --muted: #6b7280; --accent: #2f6df6; --good: #17803d; --bad: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --card: #1e2126; --line: #31353c; --text: #e8eaed;
      --muted: #9aa1ab; --accent: #6b9bff; --good: #56c47f; --bad: #f19063;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 48px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type="number"], input[type="date"], textarea {
    width: 100%; padding: 10px; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  .feel { display: flex; gap: 6px; }
  .feel button {
    flex: 1; padding: 10px 0; font-size: 15px; cursor: pointer; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  .feel button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .save {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer;
    background: var(--accent); border: 0; border-radius: 10px; margin-top: 4px;
  }
  .save:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 20px; }
  .msg.err { color: var(--bad); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .stat .name { font-size: 12px; color: var(--muted); }
  .stat .val { font-size: 20px; font-weight: 600; }
  .stat .diff { font-size: 12px; color: var(--muted); }
  .stat .diff.good { color: var(--good); }
  .stat .diff.bad { color: var(--bad); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  th:first-child, td:first-child { text-align: left; }
  td.memo { text-align: left; white-space: normal; min-width: 160px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>コンディション記録</h1>
  <p class="sub">ガーミンの数値を入力して保存します。同じ日付は上書きされます。</p>

  <div class="card">
    <div class="grid" style="grid-template-columns: 1fr 1fr;">
      <div>
        <label for="date">日付</label>
        <input type="date" id="date">
      </div>
      <div>
        <label for="sleepScore">睡眠スコア</label>
        <input type="number" id="sleepScore" inputmode="numeric" min="0" max="100">
      </div>
      <div>
        <label for="sleepHours">睡眠時間 (h)</label>
        <input type="number" id="sleepHours" inputmode="decimal" step="0.1" min="0" max="24">
      </div>
      <div>
        <label for="bbWake">Body Battery（起床）</label>
        <input type="number" id="bbWake" inputmode="numeric" min="0" max="100">
      </div>
      <div>
        <label for="bbLow">Body Battery（最低）</label>
        <input type="number" id="bbLow" inputmode="numeric" min="0" max="100">
      </div>
      <div>
        <label for="hrv">HRV (ms)</label>
        <input type="number" id="hrv" inputmode="numeric" min="0">
      </div>
      <div>
        <label for="restingHr">安静時心拍</label>
        <input type="number" id="restingHr" inputmode="numeric" min="0">
      </div>
      <div>
        <label for="stress">ストレス平均</label>
        <input type="number" id="stress" inputmode="numeric" min="0" max="100">
      </div>
      <div style="grid-column: 1 / -1;">
        <label for="steps">歩数（前日）</label>
        <input type="number" id="steps" inputmode="numeric" min="0">
      </div>
    </div>

    <div style="margin-top: 12px;">
      <label>体感（1=最悪 / 5=絶好調）</label>
      <div class="feel" id="feel">
        <button type="button" data-v="1">1</button>
        <button type="button" data-v="2">2</button>
        <button type="button" data-v="3">3</button>
        <button type="button" data-v="4">4</button>
        <button type="button" data-v="5">5</button>
      </div>
    </div>

    <div style="margin-top: 12px;">
      <label for="memo">メモ（体調・気になること）</label>
      <textarea id="memo"></textarea>
    </div>

    <button class="save" id="save">保存する</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>直近7日の平均（その前の7日との比較）</h2>
    <div class="stats" id="stats"><span class="empty">読み込み中…</span></div>
  </div>

  <div class="card">
    <h2>記録一覧（新しい順）</h2>
    <div class="scroll" id="history"><span class="empty">読み込み中…</span></div>
  </div>
</div>

<script>
  var FIELDS = ['sleepScore', 'sleepHours', 'bbWake', 'bbLow', 'hrv', 'restingHr', 'stress', 'steps'];
  var COLUMNS = [
    ['date', '日付'], ['wday', '曜'], ['sleepScore', '睡眠'], ['sleepHours', '時間'],
    ['bbWake', 'BB起床'], ['bbLow', 'BB最低'], ['hrv', 'HRV'], ['restingHr', '安静'],
    ['stress', 'ストレス'], ['steps', '歩数'], ['feel', '体感'], ['memo', 'メモ']
  ];
  var feel = '';

  document.getElementById('feel').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button');
    if (!btn) return;
    var v = btn.getAttribute('data-v');
    feel = (feel === v) ? '' : v;
    paintFeel();
  });

  function paintFeel() {
    Array.prototype.forEach.call(document.querySelectorAll('#feel button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-v') === feel);
    });
  }

  document.getElementById('date').addEventListener('change', function () { load(); });

  document.getElementById('save').addEventListener('click', function () {
    var payload = { date: document.getElementById('date').value, feel: feel,
                    memo: document.getElementById('memo').value };
    if (!payload.date) { message('日付を入れてください', true); return; }
    FIELDS.forEach(function (k) { payload[k] = document.getElementById(k).value; });

    setBusy(true);
    message('保存中…');
    google.script.run
      .withSuccessHandler(function (data) {
        setBusy(false);
        message('保存しました（' + payload.date + '）');
        render(data);
      })
      .withFailureHandler(function (err) {
        setBusy(false);
        message('保存できませんでした: ' + err.message, true);
      })
      .saveCondition(payload);
  });

  function setBusy(on) { document.getElementById('save').disabled = on; }

  function message(text, isError) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = isError ? 'msg err' : 'msg';
  }

  function fill(row) {
    FIELDS.forEach(function (k) {
      document.getElementById(k).value = (row && row[k] !== '' && row[k] != null) ? row[k] : '';
    });
    document.getElementById('memo').value = (row && row.memo) || '';
    feel = (row && row.feel !== '' && row.feel != null) ? String(row.feel) : '';
    paintFeel();
  }

  function render(data) {
    var date = document.getElementById('date');
    if (!date.value) date.value = data.today;

    var current = null;
    for (var i = 0; i < data.recent.length; i++) {
      if (data.recent[i].date === date.value) { current = data.recent[i]; break; }
    }
    fill(current);

    var stats = document.getElementById('stats');
    var withData = data.stats.filter(function (s) { return s.avg !== null; });
    if (!withData.length) {
      stats.innerHTML = '<span class="empty">記録が貯まると平均が出ます。</span>';
    } else {
      stats.innerHTML = withData.map(function (s) {
        var diff = '';
        if (s.diff !== null) {
          var sign = s.diff > 0 ? '+' : '';
          diff = '<div class="diff ' + s.mood + '">前週比 ' + sign + s.diff + '</div>';
        } else {
          diff = '<div class="diff">前週データなし</div>';
        }
        return '<div class="stat"><div class="name">' + s.label + '</div>' +
               '<div class="val">' + s.avg + '</div>' + diff + '</div>';
      }).join('');
    }

    var history = document.getElementById('history');
    if (!data.recent.length) {
      history.innerHTML = '<span class="empty">まだ記録がありません。</span>';
      return;
    }
    var head = '<tr>' + COLUMNS.map(function (c) { return '<th>' + c[1] + '</th>'; }).join('') + '</tr>';
    var body = data.recent.map(function (r) {
      return '<tr>' + COLUMNS.map(function (c) {
        var v = (r[c[0]] === '' || r[c[0]] == null) ? '' : r[c[0]];
        return c[0] === 'memo' ? '<td class="memo">' + escapeHtml(v) + '</td>'
                               : '<td>' + escapeHtml(v) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    history.innerHTML = '<table>' + head + body + '</table>';
  }

  function escapeHtml(v) {
    return String(v).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function load() {
    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(function (err) { message('読み込めませんでした: ' + err.message, true); })
      .loadDashboard(30);
  }

  load();
</script>
</body>
</html>
